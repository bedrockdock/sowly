<title>Sowly</title>
<style>
/* Layout: één kolom (max 760px), kaarten met dikke stickerrand, vaste tabbalk onderaan, tekenfilmplanten in lichte vensterpanelen */
:root{
--bg:#E7F4E8;--surface:#F9FEF8;--surface2:#D8EDD9;--ink:#1D3221;--muted:#47664C;--edge:#2A3B2C;--border:#B5D6B8;--accent:#2F8F46;--accent-ink:#fff;
--c-binnen:#6B49C8;--c-glas:#16809E;--c-verpot:#9C5A1C;--c-buiten:#2C7D3A;--c-uit:#C0600E;--c-oogst:#C73A26;
--panel-a:#CFEAF4;--panel-b:#E6F6E4;
--line:#2B2119;--soil:#7A5238;--soil2:#94694B;--leaf:#57B84F;--leaf2:#2F8F46;--leaf3:#8FD35C;--leafd:#2F7D3B;--tomato:#E5452E;--zuc:#3E9B4A;--pump:#F2761F;--carrot:#F28A22;--radish:#E0486E;--garlic:#F3EAF6;--bean:#6DBF4B;--yel:#FFC83D;--spin:#2E8A3E;--veld:#6FBF5E;
--head:'Fredoka','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A12;--surface:#182619;--surface2:#223524;--ink:#E3F1E2;--muted:#9BB89F;--edge:#5B8762;--border:#2E4631;--accent:#58C26B;--accent-ink:#0F1A12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A12;--surface:#182619;--surface2:#223524;--ink:#E3F1E2;--muted:#9BB89F;--edge:#5B8762;--border:#2E4631;--accent:#58C26B;--accent-ink:#0F1A12;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.top h1{font-size:1.9rem;font-weight:700}
.sub{margin:2px 0 0;color:var(--muted);font-weight:600}
.mascot{width:84px;flex:none}
.seedrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.seedlink.plant{background:var(--accent);color:var(--accent-ink)}
.seedlink{display:inline-block;margin-top:0;padding:4px 12px;border:2px solid var(--edge);border-radius:999px;font:600 .85rem var(--head);background:var(--surface2)}
.mascot{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mz{transform-box:fill-box;transform-origin:50% 100%}
.mbody{animation:mhop 4.4s ease-in-out infinite}
.mhead{transform-origin:60px 52px;animation:mtop 2.2s ease-in-out infinite}
.mleafL{transform-origin:60px 40px;animation:mwigL 2.2s ease-in-out infinite}
.mleafR{transform-origin:60px 40px;animation:mwigR 2.2s ease-in-out infinite .25s}
.marmL{transform-origin:36px 82px;animation:mwave 4.4s ease-in-out infinite}
.marmR{transform-origin:84px 82px;animation:mwaveR 4.4s ease-in-out infinite}
.mwink{transform-origin:68px 68px;animation:mwink 6.5s infinite}
.mpupil{animation:mlook 7s ease-in-out infinite}
.mheart{opacity:0;transform-origin:92px 40px;animation:mheart 4.4s ease-out infinite}
.mshadow{transform-origin:60px 112px;animation:mshad 4.4s ease-in-out infinite}
.mascot.jump .mbody{animation:mjump .8s cubic-bezier(.3,1.4,.5,1)}
.mascot.jump .mheart{animation:mheart2 .9s ease-out}
@keyframes mhop{0%,52%,100%{transform:translateY(0) scale(1,1)}58%{transform:translateY(1px) scale(1.07,.92)}68%{transform:translateY(-9px) scale(.95,1.07)}78%{transform:translateY(0) scale(1.08,.9)}86%{transform:translateY(0) scale(.98,1.03)}}
@keyframes mshad{0%,52%,100%{transform:scale(1);opacity:.28}68%{transform:scale(.75);opacity:.16}78%{transform:scale(1.08);opacity:.3}}
@keyframes mtop{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@keyframes mwigL{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}}
@keyframes mwigR{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-7deg)}}
@keyframes mwave{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(18deg)}72%{transform:rotate(-8deg)}78%{transform:rotate(14deg)}84%{transform:rotate(0)}}
@keyframes mwaveR{0%,12%,100%{transform:rotate(0)}18%{transform:rotate(-30deg)}24%{transform:rotate(-8deg)}30%{transform:rotate(-30deg)}36%{transform:rotate(-8deg)}42%{transform:rotate(-26deg)}50%{transform:rotate(0)}}
@keyframes mwink{0%,86%,100%{transform:scaleY(1)}90%{transform:scaleY(.1)}94%{transform:scaleY(1)}}
@keyframes mlook{0%,18%,100%{transform:translate(0,0)}26%,46%{transform:translate(1.6px,-.6px)}56%,76%{transform:translate(-1.6px,.4px)}}
@keyframes mheart{0%,70%{opacity:0;transform:translateY(8px) scale(.4)}80%{opacity:1;transform:translateY(-2px) scale(1)}100%{opacity:0;transform:translateY(-16px) scale(.9)}}
@keyframes mheart2{0%{opacity:0;transform:translateY(8px) scale(.4)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:translateY(-22px) scale(.9)}}
@keyframes mjump{0%{transform:scale(1)}18%{transform:translateY(2px) scale(1.12,.84)}45%{transform:translateY(-18px) scale(.9,1.14)}70%{transform:translateY(0) scale(1.1,.88)}100%{transform:scale(1)}}
.pl{display:block;width:100%;height:auto;overflow:visible}
.pl path,.pl circle,.pl ellipse,.pl rect{stroke:var(--line);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.pl .vein{fill:none;stroke-width:1.5;opacity:.45}
.pl .eyes circle{stroke-width:1.2}
.sway{transform-origin:60px 124px;animation:sway 5.2s ease-in-out infinite}
.grow{transform-origin:60px 124px;animation:grow .7s cubic-bezier(.3,1.5,.5,1) both}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes sway{0%,100%{transform:rotate(-.5deg)}28%{transform:rotate(3.6deg)}50%{transform:rotate(1.2deg)}76%{transform:rotate(3.2deg)}}
@keyframes flutter{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes flutter2{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(2.2deg)}}
.lf{transform-origin:0 0;animation:flutter 2.4s ease-in-out infinite}
.lb{transform-origin:60px 124px;animation:flutter2 3.1s ease-in-out infinite}
@keyframes grow{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grid .lf,.grid .lb,.task .lf,.task .lb{animation:none}
.pp{background:linear-gradient(var(--panel-a),var(--panel-b));border:2px solid var(--edge);border-radius:18px;overflow:hidden}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:0 3px 0 var(--edge);padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow1{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{background:var(--accent);color:var(--accent-ink);border:2px solid var(--edge);border-radius:999px;padding:8px 16px;font:600 .95rem var(--head);box-shadow:0 2px 0 var(--edge)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{padding:4px 12px;font-size:.85rem}
.icon-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);font:700 1.3rem var(--head);line-height:1;display:grid;place-items:center}
.pill{display:inline-block;background:var(--pc,var(--accent));color:#fff;border-radius:999px;padding:2px 10px;font:600 .78rem var(--head);white-space:nowrap}
.pill.soft{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--edge)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthnav h2{font-size:1.5rem;text-align:center}
.frost{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface2);border-radius:14px;padding:8px 12px}
.sec-h{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.sec-h h3{font-size:1.1rem}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border-top:1px solid var(--border);padding:8px 0}
.sec-h+.task{border-top:0}
.task.past{opacity:.5}.task.past .pp{filter:grayscale(1)}
.task-main{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:12px;text-align:left;background:none;border:0;padding:0;min-width:0}
.task .pp{width:84px;border-radius:18px}
.task b{font-family:var(--head);font-weight:600;font-size:1.05rem;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.crop{display:flex;flex-direction:column;gap:8px;text-align:left;padding:10px;background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:0 3px 0 var(--edge)}
.crop h3{font-size:1.1rem}
.crop .pp{aspect-ratio:1/1.05}.crop .pp .pl{height:100%}
.ad{border:2px dashed var(--border);border-radius:14px;text-align:center;padding:14px;color:var(--muted);font-size:.85rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:2px solid var(--edge);z-index:5}
.tab{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:14px;padding:6px 4px;font:600 .8rem var(--head);color:var(--muted)}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--surface2);color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(10,20,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border:2px solid var(--edge);border-bottom:0;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s ease-out}
.x{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);font:700 1.3rem var(--head);line-height:1}
.bigplant{max-width:230px;margin:6px auto 10px}
.stages{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.stages button{border:2px solid var(--edge);background:var(--surface);border-radius:999px;padding:3px 12px;font:600 .85rem var(--head)}
.stages button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.yc{margin-top:6px}
.yc-h,.yr{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:8px}
.months{display:flex;font:600 .7rem var(--head);color:var(--muted)}
.months span{flex:var(--d) 1 0%;text-align:center}
.yr{margin-top:6px;font-size:.78rem;font-weight:700}
.yt{position:relative;height:20px;border-radius:10px;background:var(--surface2)}
.yt .bar{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--bc);border:1.5px solid var(--edge)}
.yt .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7}
.yc.mini{max-width:460px}
.yc.mini .yc-h,.yc.mini .yr{grid-template-columns:minmax(0,1fr);gap:0}
.yc.mini .yc-h>span,.yc.mini .yr>span{display:none}
.yc.mini .months{font-size:.6rem}
.yc.mini .yr{margin-top:3px}
.yc.mini .yt{height:10px;border-radius:5px}
.yc.mini .yt .bar{top:1px;bottom:1px;border-radius:4px;border-width:1px}
@media (min-width:600px){.yc.mini .yc-h,.yc.mini .yr{grid-template-columns:78px minmax(0,1fr);gap:6px}.yc.mini .yc-h>span,.yc.mini .yr>span{display:block;font-size:.7rem}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--edge);z-index:80;font-size:.9rem}
.sheet a,.card a{color:inherit;text-decoration:underline}
.linkbtn{background:none;border:0;padding:0 2px;font:inherit;color:inherit;cursor:pointer;text-decoration:underline}
.care{display:flex;flex-direction:column;gap:8px}
.cr{display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 10px;align-items:baseline;padding:8px 12px;background:var(--surface);border:2px solid var(--edge);border-radius:14px}
.cl{font:600 .95rem var(--head)}
.cv{font-weight:700}
.cd{grid-column:2;font-size:.88rem;color:var(--muted)}
.bv,.nb{grid-column:2;font:700 .74rem var(--head);letter-spacing:.02em;margin-top:2px}
.bv{color:var(--accent)}
.bv::before{content:"✓ "}
.nb{color:var(--muted)}
.chips.unc .chip{border-style:dashed;background:var(--surface)}
.more{margin-top:10px;border:2px dashed var(--border);border-radius:14px;padding:8px 12px}
.more summary{cursor:pointer;font:600 .85rem var(--head);color:var(--muted)}
.dots{letter-spacing:2px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--edge);border-radius:999px;padding:2px 11px;font:600 .85rem var(--head);background:var(--surface);color:var(--ink)}
.chips.good .chip{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.chips.bad .chip{background:color-mix(in srgb,var(--c-oogst) 20%,var(--surface))}
.chips.good .chip::before{content:"✓ "}
.chips.bad .chip::before{content:"✕ "}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font:600 .9rem var(--head)}
.field input,.field select{border:2px solid var(--edge);border-radius:12px;background:var(--surface);padding:9px 12px;width:100%}
.sortf{flex-direction:row;align-items:center;gap:10px;margin:0}
.sortf select{width:auto;flex:0 1 auto}
.plant-card{display:flex;flex-direction:column;gap:12px}
.plant-head{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center}
.plant-head h3{font-size:1.2rem}
.gantt{position:relative;display:flex;height:16px;border:2px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--surface2)}
.gantt i{display:block;background:var(--sc)}
.gantt .t{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);border-radius:2px}
.tagdot{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--edge);background:var(--tg);vertical-align:-1px;margin-right:6px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;position:relative;padding-bottom:12px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--border)}
.steps li:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);display:grid;place-items:center;font-size:.7rem;font-weight:800}
.done .dot{background:var(--accent);color:var(--accent-ink)}
.now .dot{background:var(--yel);animation:pulse 1.6s infinite}
.steps .done{opacity:.7}
.steps b{font-family:var(--head);font-weight:600}
.empty{text-align:center;padding:26px 10px}
.note{font-size:.82rem;color:var(--muted);margin-top:16px}
.fx{position:fixed;inset:0;z-index:30;display:grid;place-content:center;justify-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 84%,transparent);animation:fxin .25s both;transition:opacity .4s}
.fx.out{opacity:0}
@keyframes fxin{from{opacity:0}to{opacity:1}}
.fx-box{position:relative;width:min(260px,68vw);aspect-ratio:1/1.1}
.fx-clip{position:absolute;inset:0;clip-path:inset(-260% -30% 17% -30%)}
.fx-plant{width:100%;transform-origin:50% 90%;animation:fxplant 3.6s cubic-bezier(.4,0,.6,1) both}
@keyframes fxplant{0%{transform:translateY(-200%) rotate(-10deg) scale(1.1)}39%{transform:translateY(0) rotate(0) scale(1.1,1.1)}43%{transform:translateY(2%) scale(1.22,.86)}51%{transform:translateY(-14%) scale(.96,1.08)}59%{transform:translateY(0) scale(1.06,.95)}66%{transform:translateY(0) scale(1)}100%{transform:translateY(104%) scale(.8)}}
.fx-soil{position:absolute;left:0;right:0;bottom:2%;width:100%;height:auto;overflow:visible}
.fx-sprout{position:absolute;left:50%;bottom:19%;width:36%;transform:translateX(-50%) scale(0);transform-origin:50% 92%;animation:fxsprout 1s 3.5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes fxsprout{to{transform:translateX(-50%) scale(1)}}
.dirt{position:absolute;left:50%;bottom:24%;width:10px;height:10px;border-radius:50%;background:var(--soil);border:2px solid var(--line);opacity:0;animation:fxdirt 1.2s ease-out both}
@keyframes fxdirt{0%{opacity:1;transform:translate(0,0)}60%{opacity:1;transform:translate(calc(var(--dx)*.8),var(--dy))}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 50px))}}
.heart{position:absolute;bottom:50%;color:var(--c-oogst);font-size:1.3rem;opacity:0;animation:fxheart 1.7s ease-out both}
@keyframes fxheart{0%{opacity:0;transform:translateY(20px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.fx-t{margin:0;font:700 1.4rem var(--head);text-align:center;opacity:0;animation:fxtext .7s 3.7s ease-out both}
@keyframes fxtext{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.plant-card.pop{animation:pulse 1s ease-out 4.9s 3}
@media (prefers-reduced-motion:reduce){.mbody,.mhead,.mleafL,.mleafR,.marmL,.marmR,.mwink,.mpupil,.mheart,.mshadow,.mascot.jump .mbody{animation:none}.fx{display:none}.sway,.grow,.eyes,.lf,.lb,.now .dot,.sheet{animation:none}}
@media (max-width:420px){.plant-head{grid-template-columns:72px minmax(0,1fr)}.plant-head .del{grid-column:1/-1}}
/* Jaarplanning: alleen op papier of in de pdf (zie printYear in app.js) */
#print{display:none}
@media print{
@page{size:A4 landscape;margin:12mm}
html,body{background:#fff!important}
body>:not(#print){display:none!important}
#print{display:block;color:#1D3221;font:9pt/1.35 var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.jp h1{font:700 18pt var(--head);margin:0}
.jp h2{font:700 14pt var(--head);margin:0 0 3mm;column-span:all}
.jp .jp-s{color:#47664C;font-size:8pt;margin:0 0 4mm}
.jp-r{display:grid;grid-template-columns:44mm minmax(0,1fr);gap:3mm;align-items:center;padding:1.5mm 0;border-bottom:1px solid #B5D6B8;break-inside:avoid}
.jp-r .jp-s{margin:0}
.jp-h{border-bottom:2px solid #2A3B2C;font:600 8pt var(--head);padding-top:0}
.jp-t{position:relative;display:flex;min-height:5mm}
.jp-t span{flex:var(--d);border-left:1px solid #D8EDD9;text-align:center}
.jp-t span:last-of-type{border-right:1px solid #D8EDD9}
.jp-t i{position:absolute;top:1mm;bottom:1mm;background:var(--sc);border-radius:1mm}
.jp .pill{font-size:7.5pt;padding:.3mm 2.2mm}
.jp-m{break-before:page;columns:2;column-gap:10mm}
.jp-m section{break-inside:avoid;margin-bottom:4mm}
.jp-m h3{font:600 11pt var(--head);margin:0 0 1mm;border-bottom:2px solid #2A3B2C}
.jp-m ul{list-style:none;margin:0;padding:0}
.jp-m li{display:grid;grid-template-columns:4mm 24mm auto minmax(0,1fr);gap:2mm;align-items:center;padding:.8mm 0;border-bottom:1px solid #D8EDD9}
.jp-box{width:3mm;height:3mm;border:1.2px solid #2A3B2C;border-radius:.6mm}

/* Taal toepassen: vult namen, tips en verzorgingsteksten in. Ontbreekt een tekst, dan valt hij terug op Nederlands. */
function applyLang(code){
  const L=LANGS[code]||LANGS.nl,F=LANGS.nl;
  const g=(a,b,k)=>(a&&a[k]!==undefined&&a[k]!==''?a[k]:b[k]);
  CROPS.forEach(c=>{const x=(L.crops||{})[c.id]||{},y=F.crops[c.id]||{};c.n=g(x,y,'n');c.tip=g(x,y,'tip')});
  for(const id in CARE){const x=(L.care||{})[id]||{},y=F.care[id]||{};['l','w','v'].forEach(k=>{CARE[id][k][1]=g(x,y,k)})}
  for(const k in ACT){const x=(L.act||{})[k]||{},y=F.act[k]||{};ACT[k].n=g(x,y,'n');ACT[k].s=g(x,y,'s')}
  for(const k in METHODS)METHODS[k]=((L.methods||{})[k])||F.methods[k];
  STAGE_NAMES.forEach((_,i)=>{STAGE_NAMES[i]=((L.stages||[])[i])||F.stages[i]});
}

/* ---- Kalenderlogica ---- */
/* Alle weken in de gegevens zijn relatief aan REF_FROST (laatste nachtvorst in NL/BE: week 20).
   Vorstgevoelige gewassen schuiven mee met de gekozen vorstweek (S.frost). S.shift is een extra
   verschuiving voor een ander klimaat of halfrond (bijv. 26 weken op het zuidelijk halfrond); weken lopen rond. */
const REF_FROST=20;
function stepsOf(c){
  const out=[];
  const add=(t,a,b,l)=>{
    const k=S.shift+(c.tender&&t!='oogst'?S.frost-REF_FROST:0);
    let x=a+k,y=b+k;
    if(!S.shift){out.push({t,a:clamp(x),b:clamp(y),l});return}
    const m=n=>((n-1)%52+52)%52+1;
    if(y-x>=51){out.push({t,a:1,b:52,l});return}
    x=m(x);y=x+(b-a)+(y-x-(b-a));
    const len=b-a;y=x+len;
    if(y>52){out.push({t,a:x,b:52,l});out.push({t,a:1,b:y-52,l})}else out.push({t,a:x,b:y,l});
  };
  c.s.forEach(([t,a,b,l])=>add(t,a,b,l));
  if(c.d.verpot){const w=Math.round(c.d.verpot/7);c.s.filter(x=>x[0]=='binnen'||x[0]=='glas').forEach(([t,a,b])=>add('verpot',a+w,b+w))}
  const by={};out.forEach(x=>(by[x.t]=by[x.t]||[]).push(x));
  return Object.values(by).flatMap(a=>{a.sort((p,q)=>p.a-q.a);const r=[];a.forEach(x=>{const l=r[r.length-1];if(l&&x.a<=l.b+1)l.b=Math.max(l.b,x.b);else r.push({...x})});return r});
}
const wm=w=>Math.min(11,Math.floor(((w-1)*7+3)/30.44));
function ranges(c,types){
  const r=stepsOf(c).filter(x=>types.includes(x.t)).map(x=>[x.a,x.b]).sort((a,b)=>a[0]-b[0]),m=[];
  r.forEach(x=>{const l=m[m.length-1];if(l&&x[0]<=l[1]+1)l[1]=Math.max(l[1],x[1]);else m.push([...x])});
  return m.map(([a,b])=>wm(a)==wm(b)?M3[wm(a)]:`${M3[wm(a)]}–${M3[wm(b)]}`).join(', ');
}
function monthTasks(y,m){
  const wA=weekOf(new Date(y,m,1,12)),wB=weekOf(new Date(y,m+1,0,12)),g={};
  CROPS.forEach(c=>stepsOf(c).forEach(st=>{if(st.a<=wB&&st.b>=wA){(g[st.t]=g[st.t]||[]);if(!g[st.t].some(x=>x.c==c))g[st.t].push({c,st,wA})}}));
  return g;
}
const methodsOf=c=>['binnen','glas','buiten'].filter(t=>c.s.some(x=>x[0]==t));

/* ---- Tijdlijn per plant ---- */
function timeline(p){
  const c=CROP[p.crop],d=c.d,t0=parse(p.date),ev=[];
  const A=(k,off,l,end)=>ev.push({k,dt:addDays(t0,off),l,end:end==null?null:addDays(t0,end)});
  A('zaai',0,c.poten&&p.method=='buiten'?'Poten':ACT[p.method].n);
  A('kiem',d.kiem,c.poten?'Eerste scheut':'Kiemt');
  if(p.method!='buiten'&&d.verpot)A('verpot',d.verpot,ACT.verpot.n);
  if(p.method!='buiten'&&d.uit)A('uitplant',d.uit,ACT.uitplant.n);
  A('oogst',d.oogst[0],ACT.oogst.n,d.oogst[1]);
  return ev.sort((a,b)=>a.dt-b.dt);
}
function stageOf(p){
  const c=CROP[p.crop],t=diff(parse(p.date),TODAY),os=c.d.oogst[0];
  if(t<c.d.kiem)return 0;
  return t<.25*os?1:t<.6*os?2:t<os?3:4;
}

function seedList(){
  const w=weekOf(TODAY),L=[];
  CROPS.forEach(c=>{
    const s=stepsOf(c).filter(x=>x.t=='binnen'||x.t=='glas'||x.t=='buiten').sort((p,q)=>p.a-q.a);
    const nxt=s.find(x=>x.b>=w);if(!nxt)return;
    const gap=Math.max(0,nxt.a-w);if(gap<=4)L.push({c,gap,a:nxt.a});
  });
  return L.sort((p,q)=>p.gap-q.gap||p.c.n.localeCompare(q.c.n)).slice(0,6);
}

function vMaand(){
  const g=monthTasks(S.y,S.m),order=Object.keys(ACT).sort((a,b)=>ACT[a].o-ACT[b].o);
  const fd=dateOfDoy(S.y,S.frost*7-3);
  let h=`<div class="stack"><div class="monthnav"><button class="icon-btn" data-a="mprev" aria-label="Vorige maand">‹</button><h2>${cap(MND[S.m])} ${S.y}</h2><button class="icon-btn" data-a="mnext" aria-label="Volgende maand">›</button></div>`;
  h+=`<div class="frost"><div class="grow1"><b>Laatste nachtvorst: week ${S.frost}</b> <span class="muted">(rond ${fmt(fd)})</span><div class="small muted">Vorstgevoelige gewassen schuiven mee.</div></div><button class="icon-btn" data-a="fminus" aria-label="Een week eerder">−</button><button class="icon-btn" data-a="fplus" aria-label="Een week later">+</button></div>`;
  const cur=S.y==Y0&&S.m==TODAY.getMonth();
  if(COMMERCE&&cur)h+=zaadCard();
  let n=0;

function ganttOf(p,ev){

  openSheet(`<h2 id="sh-title" style="padding-right:48px;margin-bottom:14px">Gewas planten</h2><form id="addf"><div class="field"><label for="f-crop">Gewas</label><select id="f-crop">${[...CROPS].sort(byName).map(x=>`<option value="${x.id}"${x.id==c.id?' selected':''}>${x.n}</option>`).join('')}</select></div><div class="field"><label for="f-method">Zaaimethode</label><select id="f-method"></select></div><div class="field"><label for="f-date">Datum van zaaien of poten</label><input type="date" id="f-date" required value="${iso(TODAY)}"></div><div class="field"><label for="f-label">Herkenning (optioneel)</label><input id="f-label" maxlength="30" placeholder="Bijvoorbeeld Roma of Rij 2"><span class="small muted" id="f-hint"></span></div><div class="field"><label for="f-bed">Plek (optioneel)</label><input id="f-bed" maxlength="30" placeholder="Bijvoorbeeld Bak 1"></div><div class="row"><button class="btn" type="submit">Toevoegen</button><button class="btn ghost" type="button" data-a="close">Annuleren</button></div></form>`);
  const fill=pref=>{const cc=CROP[$('#f-crop').value];$('#f-method').innerHTML=methodsOf(cc).map(t=>`<option value="${t}"${t==pref?' selected':''}>${METHODS[t]}</option>`).join('')};
  const hint=()=>{const cc=CROP[$('#f-crop').value],n=S.plantings.filter(x=>x.crop==cc.id).length;$('#f-hint').textContent=n?`Je hebt al ${n} ${cc.n.toLowerCase()} in je tuin. Geef deze een eigen naam, zoals de variëteit of de rij. Laat je het leeg, dan wordt het #${n+1}.`:''};
  fill(m);hint();$('#f-crop').onchange=()=>{fill();hint()};
  $('#addf').onsubmit=e=>{
    e.preventDefault();
    const cid=$('#f-crop').value,n=S.plantings.filter(x=>x.crop==cid).length;
    S.plantings.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),crop:cid,method:$('#f-method').value,date:$('#f-date').value,label:$('#f-label').value.trim()||(n?'#'+(n+1):''),bed:$('#f-bed').value.trim(),by:S.me||''});
    dbSet(S.plantings[S.plantings.length-1]);closeSheet();S.view='tuin';S.newId=S.plantings[S.plantings.length-1].id;render();scrollTo(0,0);plantFx(CROP[cid]);setTimeout(()=>{S.newId=null;$$('.plant-card.pop').forEach(x=>x.classList.remove('pop'))},9000);
  };
}

function plantFx(c){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const el=document.createElement('div');el.className='fx';el.setAttribute('role','status');el.innerHTML=fxHTML(c);
  const bye=()=>{el.classList.add('out');setTimeout(()=>el.remove(),400)};
  el.addEventListener('click',bye);document.body.appendChild(el);setTimeout(bye,5600);
}
function openEdit(id){
  const p=S.plantings.find(x=>x.id==id);if(!p)return;
  openSheet(`<h2 id="sh-title" style="padding-right:48px;margin-bottom:14px">${CROP[p.crop].n} aanpassen</h2><form id="editf"><div class="field"><label for="e-date">Datum van zaaien of poten</label><input type="date" id="e-date" required value="${esc(p.date)}"></div><div class="field"><label for="e-label">Herkenning</label><input id="e-label" maxlength="30" value="${esc(p.label||'')}" placeholder="Bijvoorbeeld Roma of Rij 2"></div><div class="field"><label for="e-bed">Plek</label><input id="e-bed" maxlength="30" value="${esc(p.bed||'')}"></div><div class="row"><button class="btn" type="submit">Opslaan</button><button class="btn ghost" type="button" data-a="close">Annuleren</button></div></form>`);
  $('#editf').onsubmit=e=>{e.preventDefault();if($('#e-date').value)p.date=$('#e-date').value;p.label=$('#e-label').value.trim();p.bed=$('#e-bed').value.trim();dbSet(p);closeSheet();render()};
}

/* ---- Events ---- */
document.addEventListener('click',e=>{
  if(e.target.id=='ov'){closeSheet();return}
  const tab=e.target.closest('.tab');
  if(tab){S.view=tab.dataset.view;S.picked=true;S.confirm=null;render();scrollTo(0,0);return}
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id;
  if(t.tagName=='A')e.preventDefault();
  if(!canEdit()&&['add','edit','del','fminus','fplus'].includes(a)){toast('Je kijkt mee in deze tuin. Aanpassen kan alleen de eigenaar of wie meewerkt.');return}
  if(hasFB()&&!S.shared&&['add','edit','del'].includes(a)){needLogin(a=='add'?{id,m:t.dataset.m}:null);return}
  if(a=='close')closeSheet();
  else if(a=='mprev'){S.m--;if(S.m<0){S.m=11;S.y--}render()}
  else if(a=='mnext'){S.m++;if(S.m>11){S.m=0;S.y++}render()}
  else if(a=='fminus'||a=='fplus'){S.frost=Math.max(14,Math.min(26,S.frost+(a=='fplus'?1:-1)));dbFrost();render()}
  else if(a=='crop')openCrop(id);
  else if(a=='seed'&&COMMERCE)openSeed(id);
  else if(a=='add')openAdd(id,t.dataset.m);
  else if(a=='edit')openEdit(id);
  else if(a=='stage'){clearInterval(playT);setStage(id,+t.dataset.s)}
  else if(a=='play'){
    clearInterval(playT);let s=0;setStage(id,0);
    playT=setInterval(()=>{s++;if(s>4){clearInterval(playT);return}setStage(id,s)},1100);
  }
  else if(a=='year')openYear();
  else if(a=='print')printYear(+t.dataset.y);
  else if(a=='login')openLogin(t.dataset.m||'in');
  else if(a=='google')google();
  else if(a=='verified')checkVerified(false).catch(()=>toast('Controleren lukte niet. Probeer het opnieuw.'));
  else if(a=='resend')sendVerify().then(()=>toast('Mail opnieuw gestuurd.'),x=>toast(authErr(x)));
  else if(a=='logout')C.fb.Au.signOut(C.fb.auth);
  else if(a=='samen')openSamen();
  else if(a=='invite')openInvite();
  else if(a=='mkinv')makeInvite(t.dataset.m).catch(()=>toast('De uitnodiging kon niet worden gemaakt. Probeer het opnieuw.'));
  else if(a=='copyinv'){const u=$('#inv-url');u.select();(navigator.clipboard?navigator.clipboard.writeText(u.value):Promise.reject()).then(()=>toast('Link gekopieerd.'),()=>{try{document.execCommand('copy');toast('Link gekopieerd.')}catch(x){}})}
  else if(a=='shareinv')navigator.share({title:'Sowly',text:'Doe mee in mijn moestuin op Sowly',url:$('#inv-url').value}).catch(()=>{});
  else if(a=='kick'){
    if(S.confirm=='kick:'+id){S.confirm=null;kick(id).catch(()=>toast('Dat lukte niet. Probeer het opnieuw.'))}else S.confirm='kick:'+id;
    render();
  }
  else if(a=='leave'){
    if(S.confirm=='leave'){S.confirm=null;leaveGarden().catch(()=>toast('Dat lukte niet. Probeer het opnieuw.'))}else S.confirm='leave';
    render();
  }
  else if(a=='del'){
    if(S.confirm==id){S.plantings=S.plantings.filter(p=>p.id!=id);S.confirm=null;dbDel(id)}else S.confirm=id;
    render();
  }
});
document.addEventListener('change',e=>{if(e.target.id=='t-sort'){S.sort=e.target.value;render();$('#t-sort').focus();return}if(e.target.id=='g-sel')switchGarden(e.target.value).catch(()=>toast('Die tuin kon niet worden geopend.'))});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;$('#grid').innerHTML=gridHTML()}});
$('#sh-close').onclick=closeSheet;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&C.user&&!C.user.emailVerified)checkVerified(true).catch(()=>{})});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#ov').hidden)closeSheet()});

/* ---- Start ---- */
$('#today').textContent=`${cap(DAGN[TODAY.getDay()])} ${TODAY.getDate()} ${MND[TODAY.getMonth()]} · week ${weekOf(TODAY)}`;
const MASCOT=`<svg class="pl" viewBox="0 0 120 124" role="img" aria-label="Kiempje, de mascotte van Sowly"><ellipse class="mshadow" cx="60" cy="114" rx="30" ry="6" style="fill:#000;stroke:none;opacity:.28"/><g class="mbody mz"><path class="marmL" d="M38 84 C26 86 20 78 22 70 C30 70 36 74 40 80Z" style="fill:var(--leaf)"/><path class="marmR" d="M82 84 C94 86 100 78 98 70 C90 70 84 74 80 80Z" style="fill:var(--leaf)"/><path d="M26 112 C22 92 34 60 60 60 C86 60 98 92 94 112 C80 118 40 118 26 112Z" style="fill:var(--leaf3)"/><path d="M30 106 C40 112 80 112 90 106" style="fill:none;stroke:var(--soil);stroke-width:7"/><path d="M24 114 C34 106 86 106 96 114 C86 120 34 120 24 114Z" style="fill:var(--soil)"/><g class="mhead"><path d="M60 62 C60 52 59 46 60 38" style="fill:none;stroke-width:4"/><path class="mleafL" d="M60 42 C46 44 32 36 30 22 C46 20 58 28 60 42Z" style="fill:var(--leaf)"/><path class="mleafR" d="M60 42 C74 40 90 32 92 18 C76 16 62 26 60 42Z" style="fill:var(--leaf2)"/><path class="vein" d="M58 40 C50 34 42 28 36 24"/><path class="vein" d="M62 40 C70 32 80 26 88 20"/></g><circle cx="48" cy="80" r="9" style="fill:#fff"/><circle cx="72" cy="80" r="9" style="fill:#fff"/><g class="mpupil"><circle cx="50" cy="81" r="4.6" style="fill:var(--line);stroke:none"/><circle cx="51.6" cy="79.2" r="1.5" style="fill:#fff;stroke:none"/><g class="mwink"><circle cx="74" cy="81" r="4.6" style="fill:var(--line);stroke:none"/><circle cx="75.6" cy="79.2" r="1.5" style="fill:#fff;stroke:none"/></g></g><ellipse cx="38" cy="93" rx="5" ry="3.2" style="fill:#F4958C;stroke:none;opacity:.8"/><ellipse cx="82" cy="93" rx="5" ry="3.2" style="fill:#F4958C;stroke:none;opacity:.8"/><path d="M52 93 Q60 102 68 93Z" style="fill:#B3392F;stroke-width:2.2"/></g><path class="mheart" d="M92 42 C86 36 80 42 92 52 C104 42 98 36 92 42Z" style="fill:var(--radish);stroke-width:2"/></svg>`;
$('#mascot').innerHTML=MASCOT;
$('#mascot').addEventListener('click',function(){this.classList.remove('jump');void this.offsetWidth;this.classList.add('jump');setTimeout(()=>this.classList.remove('jump'),950)});
render();startShared();startCloud();
})();

</script>
