<title>Sowly</title>
<style>
/* Layout: één kolom (max 760px), kaarten met dikke stickerrand, vaste tabbalk onderaan, tekenfilmplanten in lichte vensterpanelen */
:root{
--bg:#E7F4E8;--surface:#F9FEF8;--surface2:#D8EDD9;--ink:#1D3221;--muted:#47664C;--edge:#2A3B2C;--border:#B5D6B8;--accent:#2F8F46;--accent-ink:#fff;
--c-binnen:#6B49C8;--c-glas:#16809E;--c-verpot:#9C5A1C;--c-buiten:#2C7D3A;--c-uit:#C0600E;--c-oogst:#C73A26;
--panel-a:#CFEAF4;--panel-b:#E6F6E4;
--line:#2B2119;--soil:#7A5238;--soil2:#94694B;--leaf:#57B84F;--leaf2:#2F8F46;--leaf3:#8FD35C;--leafd:#2F7D3B;--tomato:#E5452E;--zuc:#3E9B4A;--pump:#F2761F;--carrot:#F28A22;--radish:#E0486E;--garlic:#F3EAF6;--bean:#6DBF4B;--yel:#FFC83D;--spin:#2E8A3E;--veld:#6FBF5E;
--head:'Fredoka','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A12;--surface:#182619;--surface2:#223524;--ink:#E3F1E2;--muted:#9BB89F;--edge:#5B8762;--border:#2E4631;--accent:#58C26B;--accent-ink:#0F1A12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A12;--surface:#182619;--surface2:#223524;--ink:#E3F1E2;--muted:#9BB89F;--edge:#5B8762;--border:#2E4631;--accent:#58C26B;--accent-ink:#0F1A12;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.top h1{font-size:1.9rem;font-weight:700}
.sub{margin:2px 0 0;color:var(--muted);font-weight:600}
.mascot{width:84px;flex:none}
.seedrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.seedlink.plant{background:var(--accent);color:var(--accent-ink)}
.seedlink{display:inline-block;margin-top:0;padding:4px 12px;border:2px solid var(--edge);border-radius:999px;font:600 .85rem var(--head);background:var(--surface2)}
.mascot{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mz{transform-box:fill-box;transform-origin:50% 100%}
.mbody{animation:mhop 4.4s ease-in-out infinite}
.mhead{transform-origin:60px 52px;animation:mtop 2.2s ease-in-out infinite}
.mleafL{transform-origin:60px 40px;animation:mwigL 2.2s ease-in-out infinite}
.mleafR{transform-origin:60px 40px;animation:mwigR 2.2s ease-in-out infinite .25s}
.marmL{transform-origin:36px 82px;animation:mwave 4.4s ease-in-out infinite}
.marmR{transform-origin:84px 82px;animation:mwaveR 4.4s ease-in-out infinite}
.mwink{transform-origin:68px 68px;animation:mwink 6.5s infinite}
.mpupil{animation:mlook 7s ease-in-out infinite}
.mheart{opacity:0;transform-origin:92px 40px;animation:mheart 4.4s ease-out infinite}
.mshadow{transform-origin:60px 112px;animation:mshad 4.4s ease-in-out infinite}
.mascot.jump .mbody{animation:mjump .8s cubic-bezier(.3,1.4,.5,1)}
.mascot.jump .mheart{animation:mheart2 .9s ease-out}
@keyframes mhop{0%,52%,100%{transform:translateY(0) scale(1,1)}58%{transform:translateY(1px) scale(1.07,.92)}68%{transform:translateY(-9px) scale(.95,1.07)}78%{transform:translateY(0) scale(1.08,.9)}86%{transform:translateY(0) scale(.98,1.03)}}
@keyframes mshad{0%,52%,100%{transform:scale(1);opacity:.28}68%{transform:scale(.75);opacity:.16}78%{transform:scale(1.08);opacity:.3}}
@keyframes mtop{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@keyframes mwigL{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}}
@keyframes mwigR{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-7deg)}}
@keyframes mwave{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(18deg)}72%{transform:rotate(-8deg)}78%{transform:rotate(14deg)}84%{transform:rotate(0)}}
@keyframes mwaveR{0%,12%,100%{transform:rotate(0)}18%{transform:rotate(-30deg)}24%{transform:rotate(-8deg)}30%{transform:rotate(-30deg)}36%{transform:rotate(-8deg)}42%{transform:rotate(-26deg)}50%{transform:rotate(0)}}
@keyframes mwink{0%,86%,100%{transform:scaleY(1)}90%{transform:scaleY(.1)}94%{transform:scaleY(1)}}
@keyframes mlook{0%,18%,100%{transform:translate(0,0)}26%,46%{transform:translate(1.6px,-.6px)}56%,76%{transform:translate(-1.6px,.4px)}}
@keyframes mheart{0%,70%{opacity:0;transform:translateY(8px) scale(.4)}80%{opacity:1;transform:translateY(-2px) scale(1)}100%{opacity:0;transform:translateY(-16px) scale(.9)}}
@keyframes mheart2{0%{opacity:0;transform:translateY(8px) scale(.4)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:translateY(-22px) scale(.9)}}
@keyframes mjump{0%{transform:scale(1)}18%{transform:translateY(2px) scale(1.12,.84)}45%{transform:translateY(-18px) scale(.9,1.14)}70%{transform:translateY(0) scale(1.1,.88)}100%{transform:scale(1)}}
.pl{display:block;width:100%;height:auto;overflow:visible}
.pl path,.pl circle,.pl ellipse,.pl rect{stroke:var(--line);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.pl .vein{fill:none;stroke-width:1.5;opacity:.45}
.pl .eyes circle{stroke-width:1.2}
.sway{transform-origin:60px 124px;animation:sway 5.2s ease-in-out infinite}
.grow{transform-origin:60px 124px;animation:grow .7s cubic-bezier(.3,1.5,.5,1) both}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes sway{0%,100%{transform:rotate(-.5deg)}28%{transform:rotate(3.6deg)}50%{transform:rotate(1.2deg)}76%{transform:rotate(3.2deg)}}
@keyframes flutter{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes flutter2{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(2.2deg)}}
.lf{transform-origin:0 0;animation:flutter 2.4s ease-in-out infinite}
.lb{transform-origin:60px 124px;animation:flutter2 3.1s ease-in-out infinite}
@keyframes grow{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grid .lf,.grid .lb,.task .lf,.task .lb{animation:none}
.pp{background:linear-gradient(var(--panel-a),var(--panel-b));border:2px solid var(--edge);border-radius:18px;overflow:hidden}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:0 3px 0 var(--edge);padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow1{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{background:var(--accent);color:var(--accent-ink);border:2px solid var(--edge);border-radius:999px;padding:8px 16px;font:600 .95rem var(--head);box-shadow:0 2px 0 var(--edge)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{padding:4px 12px;font-size:.85rem}
.icon-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);font:700 1.3rem var(--head);line-height:1;display:grid;place-items:center}
.pill{display:inline-block;background:var(--pc,var(--accent));color:#fff;border-radius:999px;padding:2px 10px;font:600 .78rem var(--head);white-space:nowrap}
.pill.soft{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--edge)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthnav h2{font-size:1.5rem;text-align:center}
.frost{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface2);border-radius:14px;padding:8px 12px}
.sec-h{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.sec-h h3{font-size:1.1rem}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border-top:1px solid var(--border);padding:8px 0}
.sec-h+.task{border-top:0}
.task.past{opacity:.5}.task.past .pp{filter:grayscale(1)}
.task-main{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:12px;text-align:left;background:none;border:0;padding:0;min-width:0}
.task .pp{width:84px;border-radius:18px}
.task b{font-family:var(--head);font-weight:600;font-size:1.05rem;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.crop{display:flex;flex-direction:column;gap:8px;text-align:left;padding:10px;background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:0 3px 0 var(--edge)}
.crop h3{font-size:1.1rem}
.crop .pp{aspect-ratio:1/1.05}.crop .pp .pl{height:100%}
.ad{border:2px dashed var(--border);border-radius:14px;text-align:center;padding:14px;color:var(--muted);font-size:.85rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:2px solid var(--edge);z-index:5}
.tab{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:14px;padding:6px 4px;font:600 .8rem var(--head);color:var(--muted)}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--surface2);color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(10,20,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border:2px solid var(--edge);border-bottom:0;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s ease-out}
.x{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);font:700 1.3rem var(--head);line-height:1}
.bigplant{max-width:230px;margin:6px auto 10px}
.stages{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.stages button{border:2px solid var(--edge);background:var(--surface);border-radius:999px;padding:3px 12px;font:600 .85rem var(--head)}
.stages button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.yc{margin-top:6px}
.yc-h,.yr{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:8px}
.months{display:flex;font:600 .7rem var(--head);color:var(--muted)}
.months span{flex:var(--d) 1 0%;text-align:center}
.yr{margin-top:6px;font-size:.78rem;font-weight:700}
.yt{position:relative;height:20px;border-radius:10px;background:var(--surface2)}
.yt .bar{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--bc);border:1.5px solid var(--edge)}
.yt .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7}
.yc.mini{max-width:460px}
.yc.mini .yc-h,.yc.mini .yr{grid-template-columns:minmax(0,1fr);gap:0}
.yc.mini .yc-h>span,.yc.mini .yr>span{display:none}
.yc.mini .months{font-size:.6rem}
.yc.mini .yr{margin-top:3px}
.yc.mini .yt{height:10px;border-radius:5px}
.yc.mini .yt .bar{top:1px;bottom:1px;border-radius:4px;border-width:1px}
@media (min-width:600px){.yc.mini .yc-h,.yc.mini .yr{grid-template-columns:78px minmax(0,1fr);gap:6px}.yc.mini .yc-h>span,.yc.mini .yr>span{display:block;font-size:.7rem}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--edge);z-index:80;font-size:.9rem}
.sheet a,.card a,.inl a{color:inherit;text-decoration:underline}
.linkbtn{background:none;border:0;padding:0 2px;font:inherit;color:inherit;cursor:pointer;text-decoration:underline}
.care{display:flex;flex-direction:column;gap:8px}
.cr{display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 10px;align-items:baseline;padding:8px 12px;background:var(--surface);border:2px solid var(--edge);border-radius:14px}
.cl{font:600 .95rem var(--head)}
.cv{font-weight:700}
.cd{grid-column:2;font-size:.88rem;color:var(--muted)}
.bv,.nb{grid-column:2;font:700 .74rem var(--head);letter-spacing:.02em;margin-top:2px}
.bv{color:var(--accent)}
.bv::before{content:"✓ "}
.nb{color:var(--muted)}
.chips.unc .chip{border-style:dashed;background:var(--surface)}
.more{margin-top:10px;border:2px dashed var(--border);border-radius:14px;padding:8px 12px}
.more summary{cursor:pointer;font:600 .85rem var(--head);color:var(--muted)}
.dots{letter-spacing:2px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--edge);border-radius:999px;padding:2px 11px;font:600 .85rem var(--head);background:var(--surface);color:var(--ink)}
.chips.good .chip{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.chips.bad .chip{background:color-mix(in srgb,var(--c-oogst) 20%,var(--surface))}
.chips.good .chip::before{content:"✓ "}
.chips.bad .chip::before{content:"✕ "}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font:600 .9rem var(--head)}
.field input,.field select{border:2px solid var(--edge);border-radius:12px;background:var(--surface);padding:9px 12px;width:100%}
.sortf{flex-direction:row;align-items:center;gap:10px;margin:0}
.sortf select{width:auto;flex:0 1 auto}
.plant-card{display:flex;flex-direction:column;gap:12px}
.plant-head{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center}
.plant-head h3{font-size:1.2rem}
.gantt{position:relative;display:flex;height:16px;border:2px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--surface2)}
.gantt i{display:block;background:var(--sc)}
.gantt .t{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);border-radius:2px}
.tagdot{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--edge);background:var(--tg);vertical-align:-1px;margin-right:6px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;position:relative;padding-bottom:12px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--border)}
.steps li:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);display:grid;place-items:center;font-size:.7rem;font-weight:800}
.done .dot{background:var(--accent);color:var(--accent-ink)}
.now .dot{background:var(--yel);animation:pulse 1.6s infinite}
.steps .done{opacity:.7}
.steps b{font-family:var(--head);font-weight:600}
.empty{text-align:center;padding:26px 10px}
.note{font-size:.82rem;color:var(--muted);margin-top:16px}
/* Rechtsboven: vlag (taal) en tandwiel (instellingen) */
.topbtns{display:flex;gap:8px;align-self:flex-start;margin-left:auto}
/* Past de titel met datum niet meer naast de knoppen, dan gaan de knoppen naar een eigen regel */
.top{flex-wrap:wrap;row-gap:10px}
.top>div:nth-child(2){flex:1 1 190px;min-width:190px}
.topb .flag{width:24px;height:16px;border-radius:3px;border:1.5px solid var(--edge);display:block}
.topinst{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;white-space:nowrap}
.topb .gear{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langb{display:inline-flex;align-items:center;gap:8px}
.langb .flag{width:24px;height:16px;border-radius:3px;border:1.5px solid var(--edge);flex:none}
.langb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.landnote{border-style:dashed;padding:10px 14px;color:var(--ink)}
.fx{position:fixed;inset:0;z-index:30;display:grid;place-content:center;justify-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 84%,transparent);animation:fxin .25s both;transition:opacity .4s}
.fx.out{opacity:0}
@keyframes fxin{from{opacity:0}to{opacity:1}}
.fx-box{position:relative;width:min(260px,68vw);aspect-ratio:1/1.1}
.fx-clip{position:absolute;inset:0;clip-path:inset(-260% -30% 17% -30%)}
.fx-plant{width:100%;transform-origin:50% 90%;animation:fxplant 3.6s cubic-bezier(.4,0,.6,1) both}
@keyframes fxplant{0%{transform:translateY(-200%) rotate(-10deg) scale(1.1)}39%{transform:translateY(0) rotate(0) scale(1.1,1.1)}43%{transform:translateY(2%) scale(1.22,.86)}51%{transform:translateY(-14%) scale(.96,1.08)}59%{transform:translateY(0) scale(1.06,.95)}66%{transform:translateY(0) scale(1)}100%{transform:translateY(104%) scale(.8)}}
.fx-soil{position:absolute;left:0;right:0;bottom:2%;width:100%;height:auto;overflow:visible}
.fx-sprout{position:absolute;left:50%;bottom:19%;width:36%;transform:translateX(-50%) scale(0);transform-origin:50% 92%;animation:fxsprout 1s 3.5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes fxsprout{to{transform:translateX(-50%) scale(1)}}
.dirt{position:absolute;left:50%;bottom:24%;width:10px;height:10px;border-radius:50%;background:var(--soil);border:2px solid var(--line);opacity:0;animation:fxdirt 1.2s ease-out both}
@keyframes fxdirt{0%{opacity:1;transform:translate(0,0)}60%{opacity:1;transform:translate(calc(var(--dx)*.8),var(--dy))}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 50px))}}
.heart{position:absolute;bottom:50%;color:var(--c-oogst);font-size:1.3rem;opacity:0;animation:fxheart 1.7s ease-out both}
@keyframes fxheart{0%{opacity:0;transform:translateY(20px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.fx-t{margin:0;font:700 1.4rem var(--head);text-align:center;opacity:0;animation:fxtext .7s 3.7s ease-out both}
@keyframes fxtext{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.plant-card.pop{animation:pulse 1s ease-out 4.9s 3}
@media (prefers-reduced-motion:reduce){.mbody,.mhead,.mleafL,.mleafR,.marmL,.marmR,.mwink,.mpupil,.mheart,.mshadow,.mascot.jump .mbody{animation:none}.fx{display:none}.sway,.grow,.eyes,.lf,.lb,.now .dot,.sheet{animation:none}}
@media (max-width:420px){.plant-head{grid-template-columns:72px minmax(0,1fr)}.plant-head .del{grid-column:1/-1}}
/* Jaarplanning: alleen op papier of in de pdf (zie printYear in app.js) */
#print{display:none}
@media print{
@page{size:A4 landscape;margin:12mm}
html,body{background:#fff!important}
body>:not(#print){display:none!important}
#print{display:block;color:#1D3221;font:9pt/1.35 var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.jp h1{font:700 18pt var(--head);margin:0}
.jp h2{font:700 14pt var(--head);margin:0 0 3mm;column-span:all}
.jp .jp-s{color:#47664C;font-size:8pt;margin:0 0 4mm}
.jp-r{display:grid;grid-template-columns:44mm minmax(0,1fr);gap:3mm;align-items:center;padding:1.5mm 0;border-bottom:1px solid #B5D6B8;break-inside:avoid}
.jp-r .jp-s{margin:0}
.jp-h{border-bottom:2px solid #2A3B2C;font:600 8pt var(--head);padding-top:0}
.jp-t{position:relative;display:flex;min-height:5mm}
.jp-t span{flex:var(--d);border-left:1px solid #D8EDD9;text-align:center}
.jp-t span:last-of-type{border-right:1px solid #D8EDD9}
.jp-t i{position:absolute;top:1mm;bottom:1mm;background:var(--sc);border-radius:1mm}
.jp .pill{font-size:7.5pt;padding:.3mm 2.2mm}
.jp-m{break-before:page;columns:2;column-gap:10mm}
.jp-m section{break-inside:avoid;margin-bottom:4mm}
.jp-m h3{font:600 11pt var(--head);margin:0 0 1mm;border-bottom:2px solid #2A3B2C}
.jp-m ul{list-style:none;margin:0;padding:0}
.jp-m li{display:grid;grid-template-columns:4mm 24mm auto minmax(0,1fr);gap:2mm;align-items:center;padding:.8mm 0;border-bottom:1px solid #D8EDD9}
.jp-box{width:3mm;height:3mm;border:1.2px solid #2A3B2C;border-radius:.6mm}
</style>

  "pompoen": {"n": "Pumpkin", "tip": "Frost-tender and hungry: give plenty of compost. Harvest when the stem has turned woody."},
  "stamslaboon": {"n": "Dwarf French bean", "tip": "Frost-tender. Raw beans are poisonous, so always cook them through."},
  "spinazie": {"n": "Spinach", "tip": "Sow in spring and autumn. With long days, spinach bolts."},
  "veldsla": {"n": "Lamb's lettuce", "tip": "Sow at the end of summer. Lamb's lettuce tolerates frost and gives a harvest all winter."},
  "knoflook": {"n": "Garlic", "tip": "Set the cloves 5 cm deep, tip up, 10 cm apart. Harvest when the lowest leaves turn yellow."},
  "komkommer": {"n": "Cucumber", "tip": "Frost-tender and loves warmth. Keep the soil evenly moist and harvest young for the best flavour."},
  "paprika": {"n": "Sweet pepper", "tip": "Sow early, because sweet peppers need a long, warm growing season. Only put them outside after the last frost, preferably in the greenhouse."},
  "aubergine": {"n": "Aubergine", "tip": "Loves warmth: grows best in the greenhouse or in a sheltered, sunny spot."},
  "biet": {"n": "Beetroot", "tip": "A beetroot seed contains several seedlings: thin out after they come up. Harvest at a diameter of about 5 to 8 cm."},
  "prei": {"n": "Leek", "tip": "Plant young leeks deep, in a hole of about 15 cm, so the shaft stays white. Leeks tolerate frost and can stay in the ground into winter."},
  "ui": {"n": "Onion", "tip": "Onions from seed are cheap, onion sets are the quick route. Harvest when the foliage falls over, then let the onions dry."},
  "doperwt": {"n": "Garden pea", "tip": "Sow early: peas like cool weather and tolerate light frost. Give support with twiggy sticks or netting."},
  "tuinboon": {"n": "Broad bean", "tip": "One of the earliest crops: sow from February. Pinch out the tops once the pods set; that helps against aphids."},
  "bloemkool": {"n": "Cauliflower", "tip": "Likes moist, rich soil and cool weather. Fold a leaf over the head to protect it from the sun."},
  "broccoli": {"n": "Broccoli", "tip": "Harvest the main head before the florets turn yellow. Side shoots will grow afterwards."},
  "rodekool": {"n": "Red cabbage", "tip": "A steady crop that needs space: plant about 50 cm apart. A net helps against cabbage white butterflies."},
  "boerenkool": {"n": "Kale", "tip": "Kale tastes sweeter after the first night frost. Pick the lowest leaves and let the top keep growing."},
  "rucola": {"n": "Rocket", "tip": "Ready in three to six weeks. Sow in partial shade, because in full sun rocket bolts quickly."},
  "snijbiet": {"n": "Swiss chard", "tip": "Keep picking the outer leaves, and the plant keeps growing until the first hard frost."},
  "pastinaak": {"n": "Parsnip", "tip": "Germinates slowly and only with fresh seed. The flavour improves after the first frost."},
  "peterselie": {"n": "Parsley", "tip": "Germinates slowly, sometimes only after three weeks. Keep the soil moist in the meantime."},
  "basilicum": {"n": "Basil", "tip": "Frost-tender and dislikes cold: only outside after mid-May. Pinch out the tips regularly for a bushy plant."},
  "koolrabi": {"n": "Kohlrabi", "tip": "Harvest young, at about 6 to 8 cm across. Larger bulbs turn woody."},
  "aardappel-vroeg": {"n": "Potato (early)", "tip": "Early varieties are ready quickly but do not keep long. Chit the seed potatoes beforehand and cover the foliage when there is night frost. Earthing up protects against green tubers."},
  "aardappel-laat": {"n": "Potato (late)", "tip": "Second early and maincrop varieties give the biggest yield and store well. Sources mainly name September as the harvest month. Harvest when the foliage has died back and let the potatoes dry outside. Earthing up protects against green tubers."},
  "andijvie": {"n": "Endive", "tip": "Only sow from mid-June, otherwise endive bolts. Tie the plants together a few weeks before harvest to blanch them."},
  "spruitkool": {"n": "Brussels sprouts", "tip": "A long crop: sow in spring and harvest from November. Firm the plants in well and pick the sprouts from the bottom up."},
  "wittekool": {"n": "White cabbage", "tip": "The late crop gives heads for the autumn. Plant about 50 cm apart and put up a net against cabbage white butterflies."},
  "savooiekool": {"n": "Savoy cabbage", "tip": "Sow and plant like red cabbage. A net keeps cabbage white butterflies away."},
  "chinesekool": {"n": "Chinese cabbage", "tip": "Do not sow before mid-July, and sow directly where the cabbage will stay. Harvest from mid-September to mid-November."},
  "stokboon": {"n": "Climbing French bean", "tip": "Give a climbing support of at least two metres and only sow after mid-May. Raw beans are poisonous, so always cook them through."},

  "peper": {"n": "Chilli pepper", "tip": "Sow from mid-April and only put the plant outside after the last frost. How hot the fruits get depends mainly on the variety."},
  "augurk": {"n": "Gherkin", "tip": "Sow under glass in April or directly outside from mid-May. Pick regularly and the plant keeps making new fruits."},

  "pluksla": {"n": "Loose-leaf lettuce", "tip": "Keep picking the outer leaves, and the plant keeps growing so you can harvest several times."},

  "bloemkool": {"n": "Blumenkohl", "tip": "Mag feuchten, nährstoffreichen Boden und kühles Wetter. Ein Blatt über den Kopf legen, um ihn vor der Sonne zu schützen."},
  "broccoli": {"n": "Brokkoli", "tip": "Den Hauptkopf ernten, bevor die Röschen gelb werden. Danach wachsen Seitentriebe nach."},
  "rodekool": {"n": "Rotkohl", "tip": "Eine robuste Kultur, die Platz braucht: etwa 50 cm auseinander pflanzen. Gegen Kohlweißlinge hilft ein Netz."},
  "boerenkool": {"n": "Grünkohl", "tip": "Grünkohl schmeckt nach dem ersten Nachtfrost süßer. Die unteren Blätter pflücken und die Spitze weiterwachsen lassen."},
  "rucola": {"n": "Rucola", "tip": "Fertig in drei bis sechs Wochen. Im Halbschatten säen, denn in voller Sonne schießt Rucola schnell."},
  "snijbiet": {"n": "Mangold", "tip": "Immer die äußeren Blätter pflücken, dann wächst die Pflanze bis zum ersten strengen Frost weiter."},
  "pastinaak": {"n": "Pastinake", "tip": "Keimt langsam und nur mit frischem Saatgut. Der Geschmack wird nach dem ersten Frost besser."},
  "peterselie": {"n": "Petersilie", "tip": "Keimt langsam, manchmal erst nach drei Wochen. Den Boden in der Zwischenzeit feucht halten."},
  "basilicum": {"n": "Basilikum", "tip": "Frostempfindlich und kälteempfindlich: erst nach Mitte Mai nach draußen. Die Spitzen regelmäßig auskneifen für eine buschige Pflanze."},
  "koolrabi": {"n": "Kohlrabi", "tip": "Jung ernten, bei etwa 6 bis 8 cm Durchmesser. Größere Knollen werden holzig."},
  "aardappel-vroeg": {"n": "Kartoffel (früh)", "tip": "Frühe Sorten sind schnell fertig, aber nicht lange lagerfähig. Die Pflanzkartoffeln vorher vorkeimen und das Laub bei Nachtfrost abdecken. Anhäufeln schützt vor grünen Knollen."},
  "aardappel-laat": {"n": "Kartoffel (spät)", "tip": "Mittelfrühe und späte Sorten bringen den größten Ertrag und lassen sich gut lagern. Quellen nennen vor allem September als Erntemonat. Ernten, wenn das Laub abgestorben ist, und die Kartoffeln draußen trocknen lassen. Anhäufeln schützt vor grünen Knollen."},
  "andijvie": {"n": "Endivie", "tip": "Erst ab Mitte Juni säen, sonst schießt Endivie. Die Pflanzen einige Wochen vor der Ernte zusammenbinden, um sie zu bleichen."},
  "spruitkool": {"n": "Rosenkohl", "tip": "Eine lange Kultur: im Frühjahr säen und ab November ernten. Fest anpflanzen und die Röschen von unten nach oben pflücken."},
  "wittekool": {"n": "Weißkohl", "tip": "Der späte Anbau liefert Köpfe für den Herbst. Etwa 50 cm auseinander pflanzen und ein Netz gegen Kohlweißlinge legen."},
  "savooiekool": {"n": "Wirsing", "tip": "Säen und pflanzen wie Rotkohl. Ein Netz hält Kohlweißlinge fern."},
  "chinesekool": {"n": "Chinakohl", "tip": "Nicht vor Mitte Juli säen, und direkt an den Platz, an dem der Kohl stehen bleibt. Ernte von Mitte September bis Mitte November."},
  "stokboon": {"n": "Stangenbohne", "tip": "Eine Kletterhilfe von mindestens zwei Metern geben und erst nach Mitte Mai säen. Rohe Bohnen sind giftig, also immer gar kochen."},
  "mais": {"n": "Zuckermais", "tip": "In Blöcken aus mehreren Reihen säen, damit sich die Blüten gegenseitig bestäuben. Ernten, wenn die Kolbenfäden braun sind."},
  "peper": {"n": "Chili", "tip": "Ab Mitte April säen und die Pflanze erst nach dem letzten Frost nach draußen stellen. Wie scharf die Früchte werden, hängt vor allem von der Sorte ab."},
  "augurk": {"n": "Einlegegurke", "tip": "Im April unter Glas oder ab Mitte Mai direkt ins Freiland säen. Regelmäßig pflücken, dann bildet die Pflanze weiter neue Früchte."},
  "sjalot": {"n": "Schalotte", "tip": "Die Zwiebelchen in die Erde drücken, die Spitze knapp darüber. Ernten, wenn das Laub gelb wird, und danach trocknen lassen."},
  "bosui": {"n": "Frühlingszwiebel", "tip": "Dicht in Reihen säen. Die Zwiebeln jung ziehen oder weiterwachsen lassen."},
  "pluksla": {"n": "Pflücksalat", "tip": "Immer die äußeren Blätter pflücken, dann wächst die Pflanze weiter und du kannst mehrmals ernten."},
  "winterpostelein": {"n": "Winterportulak", "tip": "Anfang September an einen Platz säen, der nach einer Ernte frei geworden ist. Ernte von Ende Oktober bis ins Frühjahr."},
  "venkel": {"n": "Knollenfenchel", "tip": "Erst nach dem 21. Juni säen, früher säen lässt ihn schießen. Fenchel nicht neben Tomate oder Dill setzen."},
  "selderij": {"n": "Knollensellerie", "tip": "Im März und April unter Glas säen und ab Mai auspflanzen. Eine geduldige Kultur mit langer Wachstumszeit."}
 },
 "care": {
  "tomaat": {"l": "So sonnig wie möglich, warm und geschützt, zum Beispiel an einer Mauer.", "w": "Regelmäßig gießen, aber nicht so viel, dass der Boden durchnässt bleibt. Ist die Pflanze zu trocken, nicht zu viel Wasser auf einmal geben.", "v": "In nährstoffreichen Boden pflanzen und Tomatendünger geben, sobald die Nährstoffe aufgebraucht sind. Mit dem Düngen aufhören und weniger gießen, sobald die Früchte rot sind."},
  "courgette": {"l": "Volle Sonne und ein warmer Platz.", "w": "Viel Wasser, besonders bei Trockenheit. Am Fuß gießen, um Mehltau zu begrenzen.", "v": "Auf Kompost oder verrotteten Mist pflanzen und beim Fruchtansatz zusätzlich düngen."},
  "sla": {"l": "Sonne im Frühjahr, Halbschatten im Sommer. Dann schießt Salat weniger schnell.", "w": "Regelmäßig und in kleinen Mengen. Bei Trockenheit wird Salat bitter.", "v": "Ein Schwachzehrer: Kompost vorab reicht."},
  "wortel": {"l": "Sonne oder leichter Halbschatten.", "w": "Den Boden bis zum Aufgehen feucht halten, danach mäßig. Wechselnde Feuchtigkeit lässt Möhren platzen.", "v": "Ein Mittelzehrer, zusätzlicher Dünger ist meist nicht nötig. Kein frischer Mist: der gibt verzweigte Möhren."},
  "radijs": {"l": "Volle Sonne. Im Sommer öfter säen und den Boden feucht halten.", "w": "Gleichmäßig feucht für schnelle, knackige Radieschen.", "v": "Keine zusätzliche Düngung nötig."},
  "pompoen": {"l": "Volle Sonne und viel Platz.", "w": "Viel Wasser, besonders während die Früchte wachsen.", "v": "Eine hungrige Pflanze: in eine Grube mit viel Kompost pflanzen."},
  "stamslaboon": {"l": "Sonne und ein warmer, geschützter Platz.", "w": "Vor allem während der Blüte und des Hülsenansatzes gießen.", "v": "Bohnen holen sich Stickstoff selbst aus der Luft. Keinen stickstoffreichen Dünger geben."},
  "spinazie": {"l": "Sonne im Frühjahr und Herbst, Halbschatten im Sommer.", "w": "Den Boden feucht halten, sonst schießt Spinat.", "v": "Mag stickstoffreichen Boden: Kompost einarbeiten."},
  "veldsla": {"l": "Sonne bis Halbschatten.", "w": "Das Saatbett bis zum Aufgehen feucht halten, danach mäßig.", "v": "Keine zusätzliche Düngung nötig."},
  "knoflook": {"l": "Volle Sonne.", "w": "Mäßig gießen. Nasser Boden im Winter führt zu Fäulnis.", "v": "Kein frischer Mist. Kompost vorab reicht."},
  "komkommer": {"l": "Volle Sonne und geschützt.", "w": "Viel Wasser, am Fuß gegeben.", "v": "Ein Starkzehrer: Kompost vorab und alle zwei Wochen düngen."},
  "paprika": {"l": "Volle Sonne, am liebsten im Gewächshaus oder an einer warmen Mauer.", "w": "Regelmäßig und reichlich gießen, gleichmäßig feucht halten.", "v": "Wöchentlich düngen, sobald die ersten Früchte ansetzen."},
  "aubergine": {"l": "Volle Sonne und viel Wärme.", "w": "Regelmäßig gießen, der Boden darf nicht austrocknen.", "v": "Ab der Blüte alle zwei Wochen düngen."},
  "biet": {"l": "Sonne bis Halbschatten.", "w": "Gleichmäßig feucht halten.", "v": "Kompost vorab, kein frischer Mist."},
  "prei": {"l": "Sonne bis leichter Halbschatten.", "w": "In Trockenperioden regelmäßig gießen.", "v": "Ein Starkzehrer: Kompost vorab und zur Saisonmitte zusätzlich düngen."},
  "ui": {"l": "Volle Sonne.", "w": "Mäßig gießen. Aufhören, sobald das Laub umfällt.", "v": "Kein frischer Mist."},
  "doperwt": {"l": "Sonne bis Halbschatten. Erbsen mögen kühlen Boden.", "w": "Vor allem während der Blüte und des Hülsenansatzes gießen.", "v": "Erbsen holen sich Stickstoff selbst aus der Luft."},
  "tuinboon": {"l": "Sonne bis Halbschatten, auch gut auf kühlem Boden.", "w": "Mäßig, während der Blüte etwas mehr.", "v": "Bildet über die Wurzeln selbst Stickstoff. Keine zusätzliche Düngung."},
  "bloemkool": {"l": "Volle Sonne, auf festem Boden.", "w": "Gleichmäßig feucht halten. Trockenheit gibt kleine, lockere Köpfe.", "v": "Ein Starkzehrer: viel Kompost vorab und zur Saisonmitte zusätzlich düngen."},

  "wittekool": {"n": "Cavolo cappuccio bianco", "tip": "La coltura tardiva dà teste per l'autunno. Pianta a circa 50 cm di distanza e metti una rete contro la cavolaia."},

  "augurk": {"n": "Cetriolino", "tip": "Semina in serra ad aprile o direttamente all'aperto da metà maggio. Raccogli spesso e la pianta continua a produrre nuovi frutti."},

   Eén bestand per taal (lang-xx.js) met crops, care, act, methods, stages, cal (kalender) en ui (interface).
   Ontbreekt een tekst in een taal, dan valt hij terug op Nederlands. */
/* België: dezelfde teksten als Nederlands en Frans, met de Belgische vlag */
LANGS['nl-BE']=Object.assign({},LANGS.nl,{name:'Nederlands (België)',flag:'be'});
LANGS['fr-BE']=Object.assign({},LANGS.fr,{name:'Français (Belgique)',flag:'be'});
const LANG_ORDER=['nl','nl-BE','fr','fr-BE','en','de','es','it'];
const LANG_KEY='sowly.taal';
/* ---- Land: los van de taal. Waarde = welke zaaigegevens gelden: nlbe = Nederlandse en Belgische bronnen, de = REGIONS.de, null = nog geen lokale bronnen ---- */
/* Frankrijk in klimaatzones (FR-N noord en west, FR-C midden en oost, FR-S zuid); '-' = zone zonder lokale bron */
const COUNTRIES={NL:'nlbe',BE:'nlbe',DE:'de',AT:null,CH:null,LU:null,'FR-N':'frn','FR-C':'frc','FR-S':'-',GB:null,IE:null,ES:null,IT:null,DK:null,SE:null,PL:null,CZ:null,SK:null};
const LAND_KEY='sowly.land';
const LAND_OF_LANG={nl:'NL','nl-BE':'BE','fr-BE':'BE',fr:'FR-N',de:'DE',en:'GB',es:'ES',it:'IT'};
/* Eerder gekozen land, anders het land uit de browsertaal (de-AT -> AT), anders het land dat bij de taal hoort */
/* Oude of grove waarden naar een land uit de lijst: FR (van vóór de zones) wordt Frankrijk noord en west */
const normLand=c=>c=='FR'?'FR-N':c;
function pickLand(){
  try{const s=normLand(localStorage.getItem(LAND_KEY));if(s&&s in COUNTRIES)return s}catch(e){}
  const nav=typeof navigator=='undefined'?[]:(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']);
  for(const l of nav){const r=normLand((String(l).split('-')[1]||'').toUpperCase());if(r in COUNTRIES)return r}
  return LAND_OF_LANG[LANG]||'NL';
}
/* Landnaam in de gekozen taal, uit de browser zelf */
function landName(c){
  let n;try{n=new Intl.DisplayNames([LANG],{type:'region'}).of(c.slice(0,2))||c}catch(e){n=c}
  return c.length>2?n+' – '+tx('zone.'+c):n;
}
const CAL={m:[],m3:[],d:[],ini:'',lower:true};
let LANG='nl',UI={};

/* Tekst uit de interface, met {plekhouders}. Waarden worden niet ontsnapt: doe dat zelf met esc() waar nodig. */
function tx(k,v){
  let s=UI[k];if(s==null)s=LANGS.nl.ui[k];if(s==null)return k;
  return v?s.replace(/\{(\w+)\}/g,(m,x)=>v[x]!=null?v[x]:m):s;
}
/* Kleine letter midden in een zin; niet in het Duits (zelfstandige naamwoorden met hoofdletter) */
const lc=s=>CAL.lower?s.toLowerCase():s;

/* Eerder gekozen taal, anders de taal van de browser, anders Engels */
function pickLang(){
  try{const s=localStorage.getItem(LANG_KEY);if(s&&LANGS[s])return s}catch(e){}
  const nav=typeof navigator=='undefined'?[]:(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']);
  for(const l of nav){
    const f=String(l).toLowerCase(),full=Object.keys(LANGS).find(k=>k.toLowerCase()==f);if(full)return full;
    const c=f.slice(0,2);if(LANGS[c])return c;
  }
  return 'en';
}

function applyLang(code){
  LANG=LANGS[code]?code:'nl';
  const L=LANGS[LANG],F=LANGS.nl;
  const g=(a,b,k)=>(a&&a[k]!==undefined&&a[k]!==''?a[k]:b[k]);
  CROPS.forEach(c=>{const x=(L.crops||{})[c.id]||{},y=F.crops[c.id]||{};c.n=g(x,y,'n');c.tip=g(x,y,'tip')});
  for(const id in CARE){const x=(L.care||{})[id]||{},y=F.care[id]||{};['l','w','v'].forEach(k=>{CARE[id][k][1]=g(x,y,k)})}
  for(const k in ACT){const x=(L.act||{})[k]||{},y=F.act[k]||{};ACT[k].n=g(x,y,'n');ACT[k].s=g(x,y,'s')}
  for(const k in METHODS)METHODS[k]=((L.methods||{})[k])||F.methods[k];
  STAGE_NAMES.forEach((_,i)=>{STAGE_NAMES[i]=((L.stages||[])[i])||F.stages[i]});
  Object.assign(CAL,F.cal,L.cal);
  UI=L.ui||{};
}

function live(table,k,v,fetch,cb){

  const f={schema:'public',table,filter:`${k}=eq.${v}`};

    .on('postgres_changes',Object.assign({event:'UPDATE'},f),load)
    .on('postgres_changes',{event:'DELETE',schema:'public',table},p=>{if(p.old&&p.old[k]==v)load()})
    .subscribe(st=>{if(st=='SUBSCRIBED')load()});
  load();

function cloudDb(gid){
  /* Zelfde vorm als claude.use('db'), zodat dbSet, dbDel en dbFrost niets hoeven te weten */
  const sb=C.sb;
  const snap=rows=>({docs:rows.map(r=>{const {garden,id,...d}=r;return {id,data:()=>d}})});
  return {
    doc:p=>{
      if(p=='garden/settings')return {
        /* Zonder kolom land (SQL-update nog niet uitgevoerd) valt dit terug op alleen de vorstweek */
        set:d=>sb.from('gardens').update({frost:d.frost,land:d.land}).eq('id',gid).then(r=>r.error?sb.from('gardens').update({frost:d.frost}).eq('id',gid):r).then(must),
        onSnapshot:cb=>live('gardens','id',gid,()=>sb.from('gardens').select('frost,land').eq('id',gid).maybeSingle().then(r=>r.error?sb.from('gardens').select('frost').eq('id',gid).maybeSingle():r),d=>cb({data:()=>d}))
      };
      const id=p.split('/')[1];
      return {
        /* "by" vult de database zelf in (zie supabase.sql) */
        set:d=>{const {by,...r}=d;return sb.from('plantings').upsert(Object.assign(r,{garden:gid,id})).then(must)},
        delete:()=>sb.from('plantings').delete().eq('garden',gid).eq('id',id).then(must)
      };
    },
    collection:n=>({onSnapshot:cb=>live(n,'garden',gid,()=>sb.from(n).select('*').eq('garden',gid),rows=>cb(snap(rows)))})
  };
}
async function startCloud(){
  if(!hasCloud())return;
  const inv=new URLSearchParams(location.search).get('uitnodiging');
  if(inv){try{localStorage.setItem(INV_KEY,inv)}catch(e){}history.replaceState(null,'',location.pathname+location.hash)}
  /* Een verlopen of al gebruikte link uit een mail komt terug met een fout achter het hekje */
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('error')){history.replaceState(null,'',location.pathname);setTimeout(()=>toast(tx(h.get('error_code')=='otp_expired'?'link.expired':'link.bad')),300)}
  try{C.sb=await sbLoad()}catch(e){C.wait=false;C.err=tx('err.loginDown');render();return}
  let first=true,uid;
  C.sb.auth.onAuthStateChange((ev,ses)=>{
    const u=ses&&ses.user||null,same=!first&&(u&&u.id)==uid;
    C.user=u;uid=u&&u.id;setIn(!!u);
    if(/access_token|type=/.test(location.hash))history.replaceState(null,'',location.pathname);
    /* Geen Supabase-aanroepen binnen deze terugroep (dat blokkeert), dus pas erna */
    setTimeout(()=>{
      if(ev=='PASSWORD_RECOVERY')openLogin('nieuwpw');
      if(same){render();return}/* alleen een ververste sessie */
      if(u){C.mail='';enterCloud().catch(e=>{C.wait=false;C.err=tx('err.gardenOpen');console.error(e);render()})}
      else{
        C.wait=false;C.newName='';
        if(S.shared){location.reload();return}
        if(first&&getInv())openLogin('in',tx('login.invited'));
      }
      first=false;render();
    },0);
  });
}

async function enterCloud(){
  const sb=C.sb,u=C.user;
  const prof=must(await sb.from('profiles').select('garden,gardens').eq('id',u.id).maybeSingle())||{};
  const gardens=Object.assign({},prof.gardens);let gid=prof.garden;
  const inv=getInv();
  if(inv){dropInv();const j=await joinInvite(inv);if(j){gardens[j.gid]=j.name;gid=j.gid;toast(tx('joined',{name:j.name}));S.view='tuin'}}
  for(const g of Object.keys(gardens))if(!(await isMember(g)))delete gardens[g];
  if(!gid||!gardens[gid])gid=Object.keys(gardens)[0];
  if(!gid){
    /* Eerste keer: eigen tuin aanmaken, met jezelf als eigenaar */
    gid=must(await sb.rpc('create_garden',{gname:tx('garden.of',{name:myName()}).slice(0,80),gfrost:S.frost,mname:myName()}));
    gardens[gid]=tx('garden.mine');
  }
  must(await sb.from('profiles').upsert({id:u.id,garden:gid,gardens,name:myName()}));
  C.gardens=gardens;C.newName='';C.err='';
  await openGarden(gid);
  /* Ingelogd: Mijn tuin is de startpagina, tenzij je zelf al een ander tabblad koos */
  if(!S.picked)S.view='tuin';
  C.wait=false;
  render();

async function openGarden(gid){
  const sb=C.sb;
  C.unsub.forEach(f=>f());C.unsub=[];
  const [me,g]=await Promise.all([sb.from('members').select('role').eq('garden',gid).eq('uid',C.user.id).maybeSingle(),sb.from('gardens').select('name').eq('id',gid).maybeSingle()]);
  if(!must(me))throw new Error('Geen lid van deze tuin');
  C.gid=gid;C.role=me.data.role;C.gname=(g.data||{}).name||'';S.me=C.user.id;
  let gone=false;
  const lost=()=>{if(gone)return;gone=true;toast(tx('noAccess'));enterCloud().catch(()=>{})};
  C.unsub=attach(cloudDb(gid),lost);
  /* Zie je jezelf niet meer bij de leden, dan ben je uit de tuin gehaald */
  C.unsub.push(live('members','garden',gid,()=>sb.from('members').select('uid,role,name,invite').eq('garden',gid),rows=>{
    if(!C.user||C.gid!=gid)return;
    if(!rows.some(m=>m.uid==C.user.id))return lost();
    C.members=rows;C.members.forEach(m=>S.names[m.uid]=m.name);render();
  }));
}

function openLogin(mode,intro){
  const nieuw=mode=='nieuw',verg=mode=='vergeten',npw=mode=='nieuwpw';
  const title=tx(npw?'lg.newpw':verg?'lg.forgot':nieuw?'lg.signup':'lg.login');
  const pw=verg?'':`<div class="field"><label for="l-pw">${tx(npw?'lg.newpw':'lg.pw')}${nieuw||npw?' '+tx('lg.min8'):''}</label><input type="password" id="l-pw"${nieuw||npw?' minlength="8"':''} autocomplete="${nieuw||npw?'new-password':'current-password'}" required></div>`;
  const links=npw?'':`<p class="small" style="margin-top:14px">${mode=='in'?`<a href="#" data-a="login" data-m="nieuw">${tx('lg.noAccount')}</a><br><a href="#" data-a="login" data-m="vergeten">${tx('lg.forgotQ')}</a>`:`<a href="#" data-a="login" data-m="in">${tx('lg.back')}</a>`}</p>`;
  openSheet(`<h2 id="sh-title" style="padding-right:48px;margin-bottom:10px">${title}</h2>${intro?`<p>${intro}</p>`:''}<form id="loginf">${nieuw?`<div class="field"><label for="l-name">${tx('lg.name')}</label><input id="l-name" maxlength="40" autocomplete="name" required><span class="small muted">${tx('lg.nameNote')}</span></div>`:''}${npw?'':`<div class="field"><label for="l-mail">${tx('lg.mail')}</label><input type="email" id="l-mail" autocomplete="email" required></div>`}${pw}<p class="small" id="l-err" role="alert" style="margin:0 0 10px"></p><button class="btn" type="submit">${tx(npw?'lg.savePw':verg?'lg.sendReset':nieuw?'lg.signup':'lg.login')}</button></form>${links}`);
  if(C.mail&&$('#l-mail'))$('#l-mail').value=C.mail;
  $('#loginf').onsubmit=async e=>{
    e.preventDefault();
    const sb=C.sb,auth=sb.auth,mail=npw?'':$('#l-mail').value.trim(),out=$('#l-err'),btn=e.target.querySelector('[type=submit]');
    const done=()=>{closeSheet();S.view='tuin';render();scrollTo(0,0)};
    out.textContent='';btn.disabled=true;
    try{
      if(npw){must(await auth.updateUser({password:$('#l-pw').value}));closeSheet();toast(tx('lg.pwChanged'));return}
      if(verg){must(await auth.resetPasswordForEmail(mail,{redirectTo:here()}));out.textContent=tx('lg.resetSent');btn.disabled=false;return}
      if(nieuw){
        C.newName=$('#l-name').value.trim();
        const d=must(await auth.signUp({email:mail,password:$('#l-pw').value,options:{data:{name:C.newName,lang:LANG.slice(0,2)},emailRedirectTo:here()}}));
        /* Bestaat het adres al, dan geeft Supabase een gebruiker zonder identiteiten terug en stuurt geen mail */
        if(d.user&&d.user.identities&&!d.user.identities.length)throw {code:'user_already_exists'};
        if(!d.session)C.mail=mail;/* eerst het e-mailadres bevestigen, zie accountCard */
        return done();
      }
      const r=await auth.signInWithPassword({email:mail,password:$('#l-pw').value});
      if(r.error&&r.error.code=='email_not_confirmed'){C.mail=mail;done();toast(tx('lg.confirmFirst'));return}
      must(r);done();
    }catch(x){if(nieuw)C.newName='';out.textContent=authErr(x);btn.disabled=false}
  };
}

/* ---- Kalenderlogica ---- */
/* Alle weken in de gegevens zijn relatief aan REF_FROST (laatste nachtvorst in NL/BE: week 20).
   Vorstgevoelige gewassen schuiven mee met de gekozen vorstweek (S.frost). S.shift is een extra
   verschuiving voor een ander klimaat of halfrond (bijv. 26 weken op het zuidelijk halfrond); weken lopen rond. */
const REF_FROST=20;
/* Periodes van het gekozen land als er een lokale bron is, anders NL/BE */
const region=()=>REGIONS[COUNTRIES[S.land]];
const sOf=c=>{const r=region();return r&&r.s[c.id]||c.s};
function stepsOf(c){
  const out=[];
  const add=(t,a,b,l)=>{
    const k=S.shift+(c.tender&&t!='oogst'?S.frost-REF_FROST:0);
    let x=a+k,y=b+k;
    if(!S.shift){out.push({t,a:clamp(x),b:clamp(y),l});return}
    const m=n=>((n-1)%52+52)%52+1;
    if(y-x>=51){out.push({t,a:1,b:52,l});return}
    x=m(x);y=x+(b-a)+(y-x-(b-a));
    const len=b-a;y=x+len;
    if(y>52){out.push({t,a:x,b:52,l});out.push({t,a:1,b:y-52,l})}else out.push({t,a:x,b:y,l});
  };
  const cs=sOf(c);
  cs.forEach(([t,a,b,l])=>add(t,a,b,l));
  if(c.d.verpot){const w=Math.round(c.d.verpot/7);cs.filter(x=>x[0]=='binnen'||x[0]=='glas').forEach(([t,a,b])=>add('verpot',a+w,b+w))}
  const by={};out.forEach(x=>(by[x.t]=by[x.t]||[]).push(x));
  return Object.values(by).flatMap(a=>{a.sort((p,q)=>p.a-q.a);const r=[];a.forEach(x=>{const l=r[r.length-1];if(l&&x.a<=l.b+1)l.b=Math.max(l.b,x.b);else r.push({...x})});return r});
}
const wm=w=>Math.min(11,Math.floor(((w-1)*7+3)/30.44));
function ranges(c,types){
  const r=stepsOf(c).filter(x=>types.includes(x.t)).map(x=>[x.a,x.b]).sort((a,b)=>a[0]-b[0]),m=[];
  r.forEach(x=>{const l=m[m.length-1];if(l&&x[0]<=l[1]+1)l[1]=Math.max(l[1],x[1]);else m.push([...x])});
  return m.map(([a,b])=>wm(a)==wm(b)?CAL.m3[wm(a)]:`${CAL.m3[wm(a)]}–${CAL.m3[wm(b)]}`).join(', ');
}
function monthTasks(y,m){
  const wA=weekOf(new Date(y,m,1,12)),wB=weekOf(new Date(y,m+1,0,12)),g={};
  CROPS.forEach(c=>stepsOf(c).forEach(st=>{if(st.a<=wB&&st.b>=wA){(g[st.t]=g[st.t]||[]);if(!g[st.t].some(x=>x.c==c))g[st.t].push({c,st,wA})}}));
  return g;
}
const methodsOf=c=>['binnen','glas','buiten'].filter(t=>sOf(c).some(x=>x[0]==t));

/* ---- Tijdlijn per plant ---- */
function timeline(p){
  const c=CROP[p.crop],d=c.d,t0=parse(p.date),ev=[];
  const A=(k,off,l,end)=>ev.push({k,dt:addDays(t0,off),l,end:end==null?null:addDays(t0,end)});
  A('zaai',0,c.poten&&p.method=='buiten'?tx('tl.plant'):ACT[p.method].n);
  A('kiem',d.kiem,tx(c.poten?'tl.shoot':'tl.sprout'));
  if(p.method!='buiten'&&d.verpot)A('verpot',d.verpot,ACT.verpot.n);
  if(p.method!='buiten'&&d.uit)A('uitplant',d.uit,ACT.uitplant.n);
  A('oogst',d.oogst[0],ACT.oogst.n,d.oogst[1]);
  return ev.sort((a,b)=>a.dt-b.dt);
}
function stageOf(p){
  const c=CROP[p.crop],t=diff(parse(p.date),TODAY),os=c.d.oogst[0];
  if(t<c.d.kiem)return 0;
  return t<.25*os?1:t<.6*os?2:t<os?3:4;
}

function openYear(){
  const ys=planYears();
  openSheet(`<h2 id="sh-title" style="padding-right:48px">${tx('yp.sheet')}</h2><p>${tx('yp.intro')}</p><div class="row" style="gap:8px">${ys.map(y=>`<button class="btn" data-a="print" data-y="${y}">${y}</button>`).join('')}</div><p class="small muted" style="margin-top:12px">${tx('yp.pdf')}</p>`);
}
function printYear(y){
  const el=$('#print'),t=document.title;
  el.innerHTML=yearPlanHTML(y);closeSheet();
  document.title=tx('yp.file',{y});/* wordt de bestandsnaam van de pdf */
  addEventListener('afterprint',()=>{document.title=t;el.innerHTML=''},{once:true});
  try{print()}catch(e){toast(tx('yp.noprint'))}
}
function samenCard(){
  if(hasCloud())return S.shared?'':accountCard();
  if(!S.shared)return `<section class="card"><div class="sec-h"><h3>${tx('samen.title')}</h3></div><p class="muted small" style="margin:0">${tx('cl.nosave')}</p></section>`;
  const ids=[...new Set(S.plantings.map(p=>p.by).filter(Boolean))];
  const who=ids.length?ids.map(i=>`<span class="pill soft">${esc(S.names[i]||tx('someone'))}${i==S.me?' '+tx('youMark'):''}</span>`).join(' '):'';
  return `<section class="card"><div class="sec-h"><h3>${tx('samen.title')}</h3></div><p class="small" style="margin:0 0 8px">${tx('cl.shared')}</p><p class="muted small" style="margin:0 0 8px">${tx('cl.invite')}</p>${who?`<div class="row" style="gap:6px;flex-wrap:wrap">${who}</div>`:''}</section>`;
}
/* Sorteren in Mijn tuin: standaard wat het eerst aandacht nodig heeft; lege herkenning of plek onderaan */
const SORTS=['aandacht','alfabet','label','plek'];
const cmpT=(a,b)=>a.localeCompare(b,LANG,{numeric:true,sensitivity:'base'});
const cmpEmpty=(a,b)=>!a!=!b?(a?-1:1):cmpT(a||'',b||'');
function needBy(p){
  const e=timeline(p).find(e=>e.k!='kiem'&&TODAY<=(e.end||e.dt));
  return e?(e.dt<=TODAY?0:+e.dt):Infinity;
}
function sortPlantings(){
  const k=S.sort||'aandacht',need=new Map(S.plantings.map(p=>[p.id,needBy(p)]));
  const byNeed=(a,b)=>need.get(a.id)-need.get(b.id)||0,byAlf=(a,b)=>cmpT(CROP[a.crop].n,CROP[b.crop].n)||cmpEmpty(a.label,b.label);
  const f={aandacht:(a,b)=>byNeed(a,b)||byAlf(a,b),alfabet:byAlf,label:(a,b)=>cmpEmpty(a.label,b.label)||byAlf(a,b),plek:(a,b)=>cmpEmpty(a.bed,b.bed)||byNeed(a,b)||byAlf(a,b)}[k]||byNeed;
  return [...S.plantings].sort(f);
}
/* Sowly als app op het beginscherm: Android en Chrome/Edge via de installatievraag van de browser, iOS met uitleg (daar bestaat geen knop voor) */
let instEv=null;
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const canInstall=()=>hasCloud()&&!isApp()&&(!!instEv||isIOS());
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;render()});
addEventListener('appinstalled',()=>{instEv=null;render();toast(tx('inst.done'))});
function installApp(){
  if(instEv){const e=instEv;e.prompt();e.userChoice.then(r=>{if(r.outcome=='accepted'){instEv=null;render()}}).catch(()=>{});return}
  const icon=`<svg viewBox="0 0 24 24" width="18" height="18" aria-label="${tx('inst.icon')}" style="vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M7 10H5v11h14V10h-2"/></svg>`;
  openSheet(`<h2 id="sh-title" style="padding-right:48px">${tx('inst.title')}</h2><p>${tx('inst.intro')}</p><ol><li>${tx('inst.s1',{icon})}</li><li>${tx('inst.s2')}</li><li>${tx('inst.s3')}</li></ol><p class="small muted">${tx('inst.note')}</p>`);
}
function vTuin(){
  const inl=hasCloud()&&S.shared?`<div class="small muted inl">${tx('tuin.inl',{name:esc(myName())})}${C.role!='owner'&&C.gname?' · '+tx('tuin.inlGarden',{g:esc(C.gname)}):''} · <a href="#" data-a="logout">${tx('logout')}</a></div>`:'';
  let h=`<div class="stack"><div class="row"><div class="grow1" style="flex:1 0 auto"><h2 style="white-space:nowrap;margin:0">${tx('tuin.title')}</h2>${inl}</div>${canEdit()&&!(C.wait&&!S.shared)?`<button class="btn" data-a="add">${tx('tuin.add')}</button>`:''}${S.shared&&mine().length?`<button class="btn sm ghost" data-a="year">${tx('tuin.year')}</button>`:''}${hasCloud()&&S.shared?samenBtn():''}</div>`;
  /* Bovenaan: inloggen of het e-mailadres bevestigen, zolang er nog niets online staat */
  if(C.wait&&!S.shared)return h+`<div class="card empty"><b>${tx('tuin.loading')}</b></div></div>`;
  const top=hasCloud()&&!S.shared&&(!C.sb||!C.user);
  if(top)h+=samenCard();
  if(!S.plantings.length)return h+`<div class="card empty"><b>${tx('tuin.emptyT')}</b><p class="muted">${tx('tuin.emptyP')}</p></div>${samenCard()}</div>`;
  h+=upcoming()+neighbourCard()+(top?'':samenCard());
  if(S.plantings.length>1)h+=`<div class="field sortf"><label for="t-sort">${tx('sort.by')}</label><select id="t-sort">${SORTS.map(k=>`<option value="${k}"${k==(S.sort||'aandacht')?' selected':''}>${tx('sort.'+k)}</option>`).join('')}</select></div>`;
  sortPlantings().forEach(p=>h+=plantCard(p));
  return h+`${adSlot()}</div>`;
}
function render(){
  $('#main').innerHTML=S.view=='maand'?vMaand():S.view=='gewassen'?vGewassen():vTuin();
  $$('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.view==S.view?'page':'false'));
  const sb=$('#samen-b');if(sb){if(S.shared)sb.innerHTML=accountCard();else closeSheet()}
  const st=$('#set-b');if(st){if(loggedIn())st.innerHTML=settingsBody();else closeSheet()}
  $('#topbtns').innerHTML=topBtns();
}

/* ---- Bladen (sheets) ---- */
let playT=null;
function openSheet(html){$('#sh-body').innerHTML=html;$('#ov').hidden=false;$('#sh-close').focus();$('.sheet').scrollTop=0}
function closeSheet(){$('#ov').hidden=true;clearInterval(playT);playT=null}
function yearChart(c,mini){
  const st=stepsOf(c),types=Object.keys(ACT).filter(t=>st.some(x=>x.t==t)).sort((a,b)=>ACT[a].o-ACT[b].o);
  const dim=[31,28,31,30,31,30,31,31,30,31,30,31],np=((doy(TODAY)-.5)/365*100).toFixed(1);
  return `<div class="yc${mini?' mini':''}"><div class="yc-h"><span></span><div class="months">${dim.map((d,i)=>`<span style="--d:${d}">${CAL.ini[i]}</span>`).join('')}</div></div>`+types.map(t=>{const lb=c.poten&&t=='buiten'?tx('tl.plant'):ACT[t].s;return `<div class="yr" title="${lb}"><span>${lb}</span><div class="yt">${st.filter(x=>x.t==t).map(x=>`<i class="bar" style="left:${((x.a-1)/52*100).toFixed(1)}%;width:${((x.b-x.a+1)/52*100).toFixed(1)}%;--bc:var(${ACT[t].c})"></i>`).join('')}<i class="now" style="left:${np}%"></i></div></div>`}).join('')+`</div>`;
}
function openCrop(id){
  const c=CROP[id];
  openSheet(`<h2 id="sh-title" style="padding-right:48px">${c.n}</h2><div class="bigplant"><div class="pp" id="bigp">${plantSVG(c,4)}</div></div><div class="stages" role="group" aria-label="${tx('cs.stages')}">${STAGE_NAMES.map((n,i)=>`<button data-a="stage" data-s="${i}" data-id="${id}" aria-pressed="${i==4}">${n}</button>`).join('')}<button data-a="play" data-id="${id}">${tx('cs.play')}</button></div><p>${c.tip}</p>${careHTML(id)}<h3 style="margin-top:14px">${tx('cs.year')}</h3>${yearChart(c)}<p class="small muted">${tx('cs.today')}</p>${cropSrc(id)}<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" data-a="add" data-id="${id}">${tx('cs.add')}</button>${COMMERCE?`<button class="btn ghost" data-a="seed" data-id="${id}">${tx('seed.find')}</button>`:''}</div>`);
}
function setStage(id,s){
  $('#bigp').innerHTML=plantSVG(CROP[id],s);
  $$('.stages [data-s]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s==s)));
}
function openAdd(id,m){
  const c=CROP[id||'tomaat'];
  openSheet(`<h2 id="sh-title" style="padding-right:48px;margin-bottom:14px">${tx('add.title')}</h2><form id="addf"><div class="field"><label for="f-crop">${tx('f.crop')}</label><select id="f-crop">${[...CROPS].sort(byName).map(x=>`<option value="${x.id}"${x.id==c.id?' selected':''}>${x.n}</option>`).join('')}</select></div><div class="field"><label for="f-method">${tx('f.method')}</label><select id="f-method"></select></div><div class="field"><label for="f-date">${tx('f.date')}</label><input type="date" id="f-date" required value="${iso(TODAY)}"></div><div class="field"><label for="f-label">${tx('f.label')}</label><input id="f-label" maxlength="30" placeholder="${tx('f.labelPh')}"><span class="small muted" id="f-hint"></span></div><div class="field"><label for="f-bed">${tx('f.bed')}</label><input id="f-bed" maxlength="30" placeholder="${tx('f.bedPh')}"></div><div class="row"><button class="btn" type="submit">${tx('add')}</button><button class="btn ghost" type="button" data-a="close">${tx('cancel')}</button></div></form>`);
  const fill=pref=>{const cc=CROP[$('#f-crop').value];$('#f-method').innerHTML=methodsOf(cc).map(t=>`<option value="${t}"${t==pref?' selected':''}>${METHODS[t]}</option>`).join('')};
  const hint=()=>{const cc=CROP[$('#f-crop').value],n=S.plantings.filter(x=>x.crop==cc.id).length;$('#f-hint').textContent=n?tx('f.hint',{n,crop:lc(cc.n),next:n+1}):''};
  fill(m);hint();$('#f-crop').onchange=()=>{fill();hint()};
  $('#addf').onsubmit=e=>{
    e.preventDefault();
    const cid=$('#f-crop').value,n=S.plantings.filter(x=>x.crop==cid).length;
    S.plantings.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),crop:cid,method:$('#f-method').value,date:$('#f-date').value,label:$('#f-label').value.trim()||(n?'#'+(n+1):''),bed:$('#f-bed').value.trim(),by:S.me||''});
    dbSet(S.plantings[S.plantings.length-1]);closeSheet();S.view='tuin';S.newId=S.plantings[S.plantings.length-1].id;render();scrollTo(0,0);plantFx(CROP[cid]);setTimeout(()=>{S.newId=null;$$('.plant-card.pop').forEach(x=>x.classList.remove('pop'))},9000);
  };
}

function plantFx(c){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const el=document.createElement('div');el.className='fx';el.setAttribute('role','status');el.innerHTML=fxHTML(c);
  const bye=()=>{el.classList.add('out');setTimeout(()=>el.remove(),400)};
  el.addEventListener('click',bye);document.body.appendChild(el);setTimeout(bye,5600);
}
function openEdit(id){
  const p=S.plantings.find(x=>x.id==id);if(!p)return;
  openSheet(`<h2 id="sh-title" style="padding-right:48px;margin-bottom:14px">${tx('edit.title',{crop:CROP[p.crop].n})}</h2><form id="editf"><div class="field"><label for="e-date">${tx('f.date')}</label><input type="date" id="e-date" required value="${esc(p.date)}"></div><div class="field"><label for="e-label">${tx('f.label2')}</label><input id="e-label" maxlength="30" value="${esc(p.label||'')}" placeholder="${tx('f.labelPh')}"></div><div class="field"><label for="e-bed">${tx('f.bed2')}</label><input id="e-bed" maxlength="30" value="${esc(p.bed||'')}"></div><div class="row"><button class="btn" type="submit">${tx('save')}</button><button class="btn ghost" type="button" data-a="close">${tx('cancel')}</button></div></form>`);
  $('#editf').onsubmit=e=>{e.preventDefault();if($('#e-date').value)p.date=$('#e-date').value;p.label=$('#e-label').value.trim();p.bed=$('#e-bed').value.trim();dbSet(p);closeSheet();render()};
}

/* ---- Events ---- */
document.addEventListener('click',e=>{
  if(e.target.id=='ov'){closeSheet();return}
  const tab=e.target.closest('.tab');
  if(tab){S.view=tab.dataset.view;S.picked=true;S.confirm=null;render();scrollTo(0,0);return}
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id;
  if(t.tagName=='A')e.preventDefault();
  if(!canEdit()&&['add','edit','del','fminus','fplus'].includes(a)){toast(tx('viewOnly'));return}
  if(hasCloud()&&!S.shared&&['add','edit','del'].includes(a)){needLogin(a=='add'?{id,m:t.dataset.m}:null);return}
  if(a=='close')closeSheet();
  else if(a=='mprev'){S.m--;if(S.m<0){S.m=11;S.y--}render()}
  else if(a=='mnext'){S.m++;if(S.m>11){S.m=0;S.y++}render()}
  else if(a=='fminus'||a=='fplus'){S.frost=Math.max(14,Math.min(26,S.frost+(a=='fplus'?1:-1)));dbFrost();render()}
  else if(a=='crop')openCrop(id);
  else if(a=='seed'&&COMMERCE)openSeed(id);
  else if(a=='add')openAdd(id,t.dataset.m);
  else if(a=='edit')openEdit(id);
  else if(a=='stage'){clearInterval(playT);setStage(id,+t.dataset.s)}
  else if(a=='play'){
    clearInterval(playT);let s=0;setStage(id,0);
    playT=setInterval(()=>{s++;if(s>4){clearInterval(playT);return}setStage(id,s)},1100);
  }
  else if(a=='year')openYear();
  else if(a=='print')printYear(+t.dataset.y);
  else if(a=='login')openLogin(t.dataset.m||'in');
  else if(a=='verified')checkVerified().catch(()=>toast(tx('checkFail')));
  else if(a=='resend')sendVerify().then(()=>toast(tx('resent')),x=>toast(authErr(x)));
  else if(a=='logout')C.sb.auth.signOut({scope:'local'});
  else if(a=='samen')openSamen();
  else if(a=='langs')openLangs();
  else if(a=='settings')openSettings();
  else if(a=='lang')setLang(t.dataset.l);
  else if(a=='app')installApp();
  else if(a=='invite')openInvite();
  else if(a=='mkinv')makeInvite(t.dataset.m).catch(()=>toast(tx('inv.fail')));
  else if(a=='copyinv'){const u=$('#inv-url');u.select();(navigator.clipboard?navigator.clipboard.writeText(u.value):Promise.reject()).then(()=>toast(tx('copied')),()=>{try{document.execCommand('copy');toast(tx('copied'))}catch(x){}})}
  else if(a=='shareinv')navigator.share({title:'Sowly',text:tx('share.text'),url:$('#inv-url').value}).catch(()=>{});
  else if(a=='kick'){
    if(S.confirm=='kick:'+id){S.confirm=null;kick(id).catch(()=>toast(tx('fail')))}else S.confirm='kick:'+id;
    render();
  }
  else if(a=='leave'){
    if(S.confirm=='leave'){S.confirm=null;leaveGarden().catch(()=>toast(tx('fail')))}else S.confirm='leave';
    render();
  }
  else if(a=='del'){
    if(S.confirm==id){S.plantings=S.plantings.filter(p=>p.id!=id);S.confirm=null;dbDel(id)}else S.confirm=id;
    render();
  }
});
document.addEventListener('change',e=>{if(e.target.id=='t-sort'){S.sort=e.target.value;render();$('#t-sort').focus();return}if(e.target.id=='land-sel'){setLand(e.target.value);return}if(e.target.id=='g-sel')switchGarden(e.target.value).catch(()=>toast(tx('switchFail')))});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;$('#grid').innerHTML=gridHTML()}});
$('#sh-close').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#ov').hidden)closeSheet()});

/* ---- Start ---- */

$('#mascot').innerHTML=MASCOT;
applyStatic();
$('#mascot').addEventListener('click',function(){this.classList.remove('jump');void this.offsetWidth;this.classList.add('jump');setTimeout(()=>this.classList.remove('jump'),950)});
if(hasCloud()&&wasIn()){C.wait=true;S.view='tuin'}
render();startShared();startCloud();
})();
