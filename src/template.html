<style>

:root[data-theme="dark"]{--bg:#0F1A12;--surface:#182619;--surface2:#223524;--ink:#E3F1E2;--muted:#9BB89F;--edge:#5B8762;--border:#2E4631;--accent:#58C26B;--accent-ink:#0F1A12;color-scheme:dark}
*{box-sizing:border-box}

@keyframes mwaveR{0%,12%,100%{transform:rotate(0)}18%{transform:rotate(-30deg)}24%{transform:rotate(-8deg)}30%{transform:rotate(-30deg)}36%{transform:rotate(-8deg)}42%{transform:rotate(-26deg)}50%{transform:rotate(0)}}
@keyframes mwink{0%,86%,100%{transform:scaleY(1)}90%{transform:scaleY(.1)}94%{transform:scaleY(1)}}
